name: Pi bench tools

# Manual-only: builds the statically linked benchmark binary for arm64 so a
# Raspberry Pi (whose distro gcc predates C23) can run the frozen `make bench`
# protocol against release-grade kernels. Artifact-only, nothing is published.
on:
  workflow_dispatch:

jobs:
  bench-arm64:
    name: bench_perf_sweep (linux-arm64, musl-static)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build static bench binary in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers
            make TARGET=linux CC=gcc GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE \
              EXTRA_LDFLAGS=-static bin/linux/release/tests/bench_perf_sweep
            file bin/linux/release/tests/bench_perf_sweep 2>/dev/null || true
            ls -la bin/linux/release/tests/
          '
      - uses: actions/upload-artifact@v4
        with:
          name: bench-perf-sweep-linux-arm64
          path: bin/linux/release/tests/bench_perf_sweep
          compression-level: 0
