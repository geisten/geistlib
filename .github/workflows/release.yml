name: Release

# Build the per-platform libgeist SDK (ROADMAP.md, "Distribution").
# Ships macos-arm64, linux-arm64 and linux-x86_64 (AVX-512) — all dependency-free
# static/self-contained builds. Windows still waits. Runs on a version tag, or
# manually for a dry run (artifacts upload either way; a tag also attaches them
# to the Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      embed_model_url:
        description: 'GGUF URL to bake into the single-file `geist-<platform>-embedded` artifact (<~1.5 GB). Empty = the default below (BitNet b1.58 2B-4T).'
        required: false
        default: ''

permissions:
  contents: write   # attach assets to the GitHub Release on a tag

# A release publishes the SDK and nothing else: libgeist.a plus the public
# headers, per platform. Runnable artefacts — a CLI, a resident daemon, a
# binary with a model baked in — are built by whoever links this engine.

jobs:
  # Refuse to publish a release whose binary would print a different version than
  # the tag, or that has no CHANGELOG entry. Source of truth: include/geist.h.
  version-guard:
    name: tag == geist.h version, CHANGELOG entry exists
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches GEIST_VERSION_STRING and has a CHANGELOG section
        run: |
          hdr=$(sed -n 's/.*GEIST_VERSION_STRING "\([0-9][0-9.]*\)".*/\1/p' include/geist.h | head -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "geist.h=$hdr  tag=$tag"
          test "$hdr" = "$tag" || { echo "::error::include/geist.h version $hdr != tag $tag — bump include/geist.h"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::no '## [$tag]' section in CHANGELOG.md"; exit 1; }
          sh scripts/check-version.sh

  linux-arm64:
    name: linux-arm64 (musl-static, dependency-free)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Build fully static against **musl** (not glibc): the result has literally
      # no libc dependency, is more portable than a glibc -static binary (no NSS /
      # glibc-version quirks), and is much smaller. Alpine 3.21 ships gcc 14
      # (needed for -std=c23) and a musl-built libgomp for OpenMP. The host job
      # stays on ubuntu-arm so checkout / upload-artifact (Node actions) work;
      # only the compile runs in the container, writing into the mounted volume.
      # GEMM_PROVIDER=native -> native NEON fp32 + vendored FFT (no OpenBLAS/FFTW),
      # so the archive carries no BLAS dependency into a consumer's link. The
      # artifact is libgeist.a plus headers: link flags like -static belong to
      # whoever links it, not to building an archive, so this job passes none.
      - name: Build + smoke + package libgeist SDK
        env:
          EMBED_MODEL_URL: ${{ inputs.embed_model_url || 'https://huggingface.co/microsoft/bitnet-b1.58-2B-4T-gguf/resolve/main/ggml-model-i2_s.gguf' }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e EMBED_MODEL_URL alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers curl
            make TARGET=linux CC=gcc GEMM_PROVIDER=native lib
            mkdir -p dist/libgeist-linux-arm64/include
            cp lib/linux/release/libgeist.a dist/libgeist-linux-arm64/
            cp include/*.h dist/libgeist-linux-arm64/include/
            cp LICENSE dist/libgeist-linux-arm64/
            d=dist/libgeist-linux-arm64
            # --whole-archive: a static link only pulls referenced objects, so a
            # plain smoke link can pass while an object the smoke never reaches
            # still has unresolved deps (geistlib#144). Forcing every object in
            # makes the link itself assert the full archive resolves with the
            # documented consumer flags.
            cc -std=c23 -I "$d/include" examples/embed_smoke.c \
              -Wl,--whole-archive "$d/libgeist.a" -Wl,--no-whole-archive \
              -fopenmp -lm -o /tmp/sdk_smoke
            /tmp/sdk_smoke
            cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/agent_smoke
            /tmp/agent_smoke

            # branch-only: static bench binary for reference-board protocol runs
            make TARGET=linux CC=gcc GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE \
              EXTRA_LDFLAGS=-static bin/linux/release/tests/bench_perf_sweep
            cp bin/linux/release/tests/bench_perf_sweep dist/bench_perf_sweep-linux-arm64

            # ---- CLI binaries (the README first screen, geistlib#: one binary) --
            # geist-linux-arm64: the slim bring-your-own-GGUF CLI (<1 MB).
            # Fully static (musl + libgomp.a): runs on any 64-bit Pi OS with
            # no toolchain, no Python, no shared libs.
            cc -std=c23 -static -I "$d/include" examples/simple_generate.c \
              "$d/libgeist.a" -fopenmp -lm -o dist/geist-linux-arm64
            # No model in this smoke: exit 2 + usage is the contract.
            ./dist/geist-linux-arm64 2>/dev/null || [ $? -eq 2 ]

            # geist-bitnet-linux-arm64: same CLI with the MIT-licensed BitNet
            # b1.58 2B-4T GGUF folded in via .incbin — literally one file,
            # ~1.2 GB. The weights alias zero-copy from .rodata and are
            # demand-paged like an mmap, so RAM behavior on a 4 GB Pi equals
            # the file-based load. GNU ld handles the >1 GB section (ld64
            # does not, which is why macOS gets no embedded artifact).
            curl -fLsS --retry 3 -o /tmp/model.gguf "$EMBED_MODEL_URL"
            {
              echo "  .section .rodata"
              echo "  .balign 64"
              echo "  .globl geist_model_start"
              echo "geist_model_start:"
              echo "  .incbin \"/tmp/model.gguf\""
              echo "  .globl geist_model_end"
              echo "geist_model_end:"
            } > /tmp/model_blob.s
            cc -std=c23 -static -DGEIST_EMBED_MODEL -I "$d/include" \
              examples/simple_generate.c /tmp/model_blob.s \
              "$d/libgeist.a" -fopenmp -lm -o dist/geist-bitnet-linux-arm64
            # Real smoke: load the embedded 2B model and decode a few tokens.
            OMP_WAIT_POLICY=active ./dist/geist-bitnet-linux-arm64 "The capital of France is" 8
          '
          tar -C dist -czf libgeist-linux-arm64.tar.gz libgeist-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: libgeist-linux-arm64
          path: libgeist-linux-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: geist-cli-linux-arm64
          path: |
            dist/geist-linux-arm64
            dist/geist-bitnet-linux-arm64
            dist/bench_perf_sweep-linux-arm64
          compression-level: 0

  linux-x86_64:
    name: linux-x86_64 (musl-static, AVX-512, dependency-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same musl-static recipe as arm64, on x86_64. BACKENDS="cpu_x86 cpu_scalar"
      # turns on the native AVX-512/VNNI backend (x86_64 still defaults to
      # cpu_scalar). Baseline is x86-64-v3 (Haswell / Zen+: AVX2+FMA) with the
      # AVX-512 kernels compiled per-TU and runtime-dispatched via hw_probe — so the
      # one binary runs on any x86-64-v3 CPU and uses AVX-512 only where present (no
      # SIGILL). GEMM_PROVIDER=native -> BLAS-free (portable scalar fp32 for the
      # vision/audio dense path; the quantized text kernels never touch BLAS).
      - name: Build + smoke + package libgeist SDK
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers
            make TARGET=linux CC=gcc BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native lib
            mkdir -p dist/libgeist-linux-x86_64/include
            cp lib/linux/release/libgeist.a dist/libgeist-linux-x86_64/
            cp include/*.h dist/libgeist-linux-x86_64/include/
            cp LICENSE dist/libgeist-linux-x86_64/
            d=dist/libgeist-linux-x86_64
            # --whole-archive: see the arm64 job (geistlib#144).
            cc -std=c23 -I "$d/include" examples/embed_smoke.c \
              -Wl,--whole-archive "$d/libgeist.a" -Wl,--no-whole-archive \
              -fopenmp -lm -o /tmp/sdk_smoke
            /tmp/sdk_smoke
            cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/agent_smoke
            /tmp/agent_smoke
          '
          tar -C dist -czf libgeist-linux-x86_64.tar.gz libgeist-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: libgeist-linux-x86_64
          path: libgeist-linux-x86_64.tar.gz

  macos-arm64:
    name: macos-arm64 (Accelerate/AMX)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install libomp
        run: brew install libomp
      # GEIST_STATIC_OMP=1 -> mk/target-mac-omp.mk links the static libomp.a
      # rather than -lomp, so geistlib's OWN binaries depend only on system
      # frameworks (Accelerate/libSystem, always present). It does not change
      # the packaged archive; see the note at the smoke link below.
      - name: Build + smoke + package libgeist SDK
        run: |
          make TARGET=mac-omp CC=clang GEIST_STATIC_OMP=1 lib
          mkdir -p dist/libgeist-macos-arm64/include
          cp lib/mac-omp/release/libgeist.a dist/libgeist-macos-arm64/
          cp include/*.h dist/libgeist-macos-arm64/include/
          cp LICENSE dist/libgeist-macos-arm64/
          d=dist/libgeist-macos-arm64
          # The archive holds geist's objects, not the OpenMP runtime: an .a is
          # not a link. GEIST_STATIC_OMP=1 governs how geistlib links its OWN
          # binaries, so a consumer of the packaged SDK still supplies libomp
          # and Accelerate itself — the same flags mk/target-mac-omp.mk uses.
          # Linking the smokes the way a real consumer must is the whole point
          # of a packaging gate (geistlib#144).
          omp=$(brew --prefix libomp)
          link="-framework Accelerate $omp/lib/libomp.a -lm"
          # -force_load = ld64's --whole-archive: every object must resolve
          # with the documented consumer flags, not just the ones the smoke
          # happens to reference (geistlib#144).
          cc -std=c23 -I "$d/include" examples/embed_smoke.c \
            -Wl,-force_load,"$d/libgeist.a" $link -o /tmp/sdk_smoke
          /tmp/sdk_smoke
          cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" $link -o /tmp/agent_smoke
          /tmp/agent_smoke
          tar -C dist -czf libgeist-macos-arm64.tar.gz libgeist-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: libgeist-macos-arm64
          path: libgeist-macos-arm64.tar.gz

  release:
    name: attach artifacts to the Release
    needs: [version-guard, linux-arm64, linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # `gh release upload` needs the Release to already exist; a pushed tag
        # alone is not a Release. Create it from the tag (auto-generated notes)
        # if absent, then attach the per-platform tarballs. Idempotent.
        run: |
          find dist \( -name '*.tar.gz' -o -name 'geist-*' \) -type f -exec sha256sum {} \; | \
            sed 's#  dist/[^/]*/#  #' | sort -k2 > SHA256SUMS
          chmod +x dist/*/geist-* || true
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                 --title "geist ${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS dist/*/*.tar.gz dist/*/geist-* \
            --repo "${GITHUB_REPOSITORY}" --clobber
