# Weekly Apple CPU guard. Gated on the RATIO to llama.cpp measured in the
# same job on the same runner (#439): the absolute floor it used before
# (60 tok/s prefill) saw 23.9, 14.4 and 38.0 from identical code on three
# consecutive Sundays — a hosted macOS runner is whatever it is that day,
# but it is the same thing for both engines within one job.
name: Apple performance guard

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      base:
        description: "optional: also measure this revision in the same job (A/B against a red run)"
        type: string
        default: ""
  # A PR that edits this file runs it once, the route to an A/B for a caller
  # that cannot dispatch (set BASE below in that PR; do not merge it set).
  pull_request:
    paths:
      - .github/workflows/apple-perf.yml

concurrency:
  group: apple-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-cpu-q4km:
    name: Apple CPU Q4_K regression guard
    runs-on: macos-15
    timeout-minutes: 100
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BASE: ${{ inputs.base || '' }}
      # The same llama.cpp pin the cross-engine campaign uses.
      LLAMA_PIN: 2d8d612e4c68d3801e556a1b4a028f55ec33ecbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libomp
        run: brew install libomp

      - name: Cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
          key: geist-apple-perf-gemma4-e2b-q4km-740185b21d22

      - name: Fetch and verify reference model
        run: |
          make fetch-model
          python3 - <<'PY'
          import hashlib, json, pathlib
          protocol = json.loads(pathlib.Path("benchmark/apple_cpu_protocol.json").read_text())
          model = pathlib.Path("gguf_artifacts/gemma4-e2b-Q4_K_M.gguf")
          digest = hashlib.sha256()
          with model.open("rb") as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          expected = protocol["model"]["sha256"]
          if actual != expected:
              raise SystemExit(f"model SHA-256 mismatch: {actual} != {expected}")
          PY

      - name: Build CPU benchmark
        run: make -j3 TARGET=mac-omp CC=clang BACKENDS="cpu_neon cpu_scalar" bin/mac-omp/release/tests/bench_perf_sweep

      - name: Detailed protocol (geist)
        env:
          BENCH_GGUF: gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
          OMP_WAIT_POLICY: active
        run: |
          echo "BENCH_THREADS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          BENCH_THREADS=$(sysctl -n hw.ncpu) python3 tools/bench_quality_perf.py \
            --suite detailed --target mac-omp --mode release \
            --bin-dir bin/mac-omp/release/tests --out-dir bench-artifacts

      # [measurement] the guard's protocol on the first-parent revisions
      # between the last green Sunday and main, one job, one runner.
      - name: Bisect points (measurement)
        env:
          BENCH_GGUF: ${{ github.workspace }}/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
          OMP_WAIT_POLICY: active
          REVS: "f76d29f 1eb97a8 ec1f203 992bf9f 74d3643 ebeaf32 f2b8a59 c0f534d 67fe9f6 1980686 f76d29f"
        run: |
          git fetch -q --unshallow origin main || git fetch -q origin main
          i=0
          for r in $REVS; do
            i=$((i+1)); d="rev$i"
            git worktree add -q "$d" "$r"
            make -C "$d" -j3 TARGET=mac-omp CC=clang BACKENDS="cpu_neon cpu_scalar" bin/mac-omp/release/tests/bench_perf_sweep >/dev/null
            (cd "$d" && python3 tools/bench_quality_perf.py --suite detailed --target mac-omp --mode release \
              --bin-dir bin/mac-omp/release/tests --out-dir "$GITHUB_WORKSPACE/bisect/$i-$r") >/dev/null 2>&1 || echo "::warning::$r bench failed"
            python3 - "$i" "$r" <<'PY'
          import json, pathlib, sys
          i, r = sys.argv[1], sys.argv[2]
          f = sorted(pathlib.Path(f"bisect/{i}-{r}").glob("*_mac-omp_detailed.jsonl"))
          line = [l for l in f[0].read_text().splitlines() if l.strip().startswith("{")][-1] if f else "{}"
          d = json.loads(line); d = d.get("measurement", d)
          print(f"::notice title=bisect {i} {r}::prefill {d.get('prefill_tps', 0):.1f} decode {d.get('decode_tps', 0):.1f} tok/s")
          PY
            git worktree remove --force "$d"
          done

      # The same protocol on BASE, built from its own tree with its own tools,
      # right after HEAD on the same runner: a ratio cliff between a green
      # and a red Sunday is then one job's A/B, not two runners' weather.
      - name: Detailed protocol (geist at BASE)
        if: env.BASE != ''
        env:
          BENCH_GGUF: ${{ github.workspace }}/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
          OMP_WAIT_POLICY: active
        run: |
          git fetch -q origin "$BASE"
          git worktree add -q base FETCH_HEAD
          make -C base -j3 TARGET=mac-omp CC=clang BACKENDS="cpu_neon cpu_scalar" bin/mac-omp/release/tests/bench_perf_sweep
          (cd base && python3 tools/bench_quality_perf.py \
            --suite detailed --target mac-omp --mode release \
            --bin-dir bin/mac-omp/release/tests --out-dir "$GITHUB_WORKSPACE/bench-base")

      # The reference engine, CPU + Accelerate like the geist build above
      # (no Metal: this is the CPU guard). One static binary, cached by pin.
      - name: Cache llama-bench
        id: llama-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llama.cpp/build/bin/llama-bench
          key: llama-bench-macos-cpu-${{ env.LLAMA_PIN }}
      - name: Build llama-bench (pinned)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/ggml-org/llama.cpp llama.cpp
          git -C llama.cpp checkout -q "$LLAMA_PIN"
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=OFF -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=OFF >/dev/null
          cmake --build llama.cpp/build --target llama-bench -j"$(sysctl -n hw.ncpu)" >/dev/null

      # Same model, same shape (pp512 / tg64, 10 repeats), same thread count.
      - name: Detailed protocol (llama.cpp)
        run: |
          llama.cpp/build/bin/llama-bench -m gguf_artifacts/gemma4-e2b-Q4_K_M.gguf \
            -p 512 -n 64 -r 10 -t "$BENCH_THREADS" -o json > bench-artifacts/llama-bench.json
          cat bench-artifacts/llama-bench.json

      - name: Ratio gate (BASE, informational)
        if: env.BASE != ''
        run: |
          python3 benchmark/perf_ratio_gate.py \
            --geist bench-base/*_mac-omp_detailed.jsonl \
            --llama bench-artifacts/llama-bench.json \
            --min-prefill-ratio 0.25 --min-decode-ratio 0.3 | sed "s/::notice title=geist vs llama.cpp::/::notice title=BASE $BASE vs llama.cpp::/" || true

      # Cliff floors on the ratio. The first run of this gate measured geist
      # at 0.40x prefill / 0.50x decode of llama.cpp on this runner (26.4 vs
      # 66.8 and 9.3 vs 18.8 tok/s, 3 threads) — nowhere near the M1 Max
      # numbers in the README, and an open question (#456). The floors sit
      # under what is measured today and above a scalar-fallback cliff; they
      # are raised when #456 moves the ratio, not before. The numbers land in
      # the step summary either way.
      - name: Ratio gate
        run: |
          python3 benchmark/perf_ratio_gate.py \
            --geist bench-artifacts/*_mac-omp_detailed.jsonl \
            --llama bench-artifacts/llama-bench.json \
            --min-prefill-ratio 0.25 --min-decode-ratio 0.3

      - name: Upload raw samples and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-cpu-q4km-${{ github.sha }}
          path: |
            bench-artifacts
            bench-base
          if-no-files-found: error
