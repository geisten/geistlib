name: gpu-debug

# One-shot: why does the PrismML fork's Vulkan llama-bench segfault on the RTX 2080 Ti
# with Bonsai-27B PQ2_0? Runs on the self-hosted GPU desktop (docs/CI_SELF_HOSTED.md).

on:
  push:
    branches: [debug/fork-vk-segfault]  # one-shot: dispatch needs the file on main

env:
  FILE: Ternary-Bonsai-2-27B-PQ2_0.gguf
  FORK_REV: 01ae597e3f7d4742909e1e831abb12fe3d24b2cf

jobs:
  debug:
    runs-on: [self-hosted, linux, x64, geist-vulkan]
    timeout-minutes: 60
    steps:
      - name: Environment
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.used --format=csv
          vulkaninfo --summary 2>&1 | grep -E "deviceName|deviceType|driverName|apiVersion|driverInfo" || true
          which gdb valgrind || true
          ls -l "$HOME/bench-cache/$FILE"
          uptime

      - name: Build fork Vulkan with symbols
        run: |
          D="$HOME/bench-cache/fork"
          [ -d "$HOME/bench-cache/spirv" ] || git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$HOME/bench-cache/spirv"
          git -C "$D" checkout -q "$FORK_REV"
          cmake -S "$D" -B "$D/build-vkdbg" -DGGML_VULKAN=ON -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-I$HOME/bench-cache/spirv/include -fno-omit-frame-pointer"
          cmake --build "$D/build-vkdbg" --target llama-bench -j"$(nproc)"

      - name: Which tensor, which CPU flags (gdb)
        run: |
          B="$HOME/bench-cache/fork/build-vkdbg/bin/llama-bench"; M="$HOME/bench-cache/$FILE"
          grep -m1 -o -w -E "avx512f|avx512_vnni|avx512vnni" /proc/cpuinfo | sort -u || true
          GGML_VK_VISIBLE_DEVICES=0 gdb -batch -ex run \
            -ex "frame 0" -ex "p tensor->name" -ex "p tensor->type" -ex "p tensor->ne" -ex "p tensor->extra" \
            -ex "p ggml_cpu_has_avx512()" -ex "p ggml_cpu_has_avx512_vnni()" \
            --args "$B" -m "$M" -ngl 99 -p 16 -n 0 -r 1 2>&1 | tail -14

      - name: Workaround, fork built with GGML_CPU_REPACK=OFF
        run: |
          D="$HOME/bench-cache/fork"
          cmake -S "$D" -B "$D/build-vknr" -DGGML_VULKAN=ON -DGGML_CPU_REPACK=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I$HOME/bench-cache/spirv/include"
          cmake --build "$D/build-vknr" --target llama-bench -j"$(nproc)"
          GGML_VK_VISIBLE_DEVICES=0 "$D/build-vknr/bin/llama-bench" -m "$HOME/bench-cache/$FILE" -ngl 99 -p 512 -n 64 -r 3 -o md
          echo "exit=$?"
