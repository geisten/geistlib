name: cross-engine-vulkan

# NVIDIA Vulkan cell of the #364 model × system matrix: run the frozen GPU
# protocol (benchmark/cross_engine_gpu_protocol.json, profile
# nvidia_2080ti_vulkan) on the org's 2080 Ti box and upload the raw JSONL +
# report as artifacts. On demand only — a campaign holds the box behind the
# quiet-host gate for however long it takes, which is not per-PR material.
# Publishing stays manual: a human (or agent) reviews the artifact and
# commits it with the MATRIX.md cell, the same path every other cell took.

on:
  workflow_dispatch:

jobs:
  campaign:
    name: Cross-engine GPU campaign (RTX 2080 Ti, Vulkan)
    # Same self-hosted guard as ci.yml's vulkan leg: never for fork PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, geist-vulkan]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to measure a software device
        run: |
          vulkaninfo --summary 2>&1 | tee vulkan-env.txt
          grep -q PHYSICAL_DEVICE_TYPE_DISCRETE_GPU vulkan-env.txt || {
            echo "no discrete GPU enumerated — a campaign on llvmpipe is not a cell"
            exit 1
          }
      - name: Build geist (vulkan + shipped x86 CPU backends)
        run: make TARGET=linux BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native bin
      - name: Ensure pinned llama.cpp Vulkan build
        # Dedicated persistent checkout outside the workspace (survives
        # checkout's git clean); rebuilt only when the pin moves. Not the
        # box's historical ~/llama.cpp — other rigs own that.
        env:
          LLAMA_PIN: 2d8d612e4c68d3801e556a1b4a028f55ec33ecbb
        run: |
          set -e
          DIR="$HOME/llama.cpp-cross-engine"
          if [ ! -x "$DIR/build-vulkan/bin/llama-bench" ] \
             || [ "$(git -C "$DIR" rev-parse HEAD)" != "$LLAMA_PIN" ]; then
            [ -d "$DIR/.git" ] || git clone https://github.com/ggml-org/llama.cpp "$DIR"
            git -C "$DIR" fetch origin "$LLAMA_PIN"
            git -C "$DIR" checkout "$LLAMA_PIN"
            # ggml-vulkan #includes spirv/unified1/spirv.hpp directly, so the
            # headers must be on the compiler's include path, not just
            # CMAKE_PREFIX_PATH. Use the box's ~/.local copy
            # (benchmark/results/VULKAN.md) or fetch a pinned clone.
            SPIRV_INC="$HOME/.local/include"
            if [ ! -f "$SPIRV_INC/spirv/unified1/spirv.hpp" ]; then
              [ -d "$DIR/spirv-headers/.git" ] || git clone --depth 1 \
                https://github.com/KhronosGroup/SPIRV-Headers "$DIR/spirv-headers"
              SPIRV_INC="$DIR/spirv-headers/include"
            fi
            cmake -S "$DIR" -B "$DIR/build-vulkan" -DGGML_VULKAN=ON \
              -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
              -DCMAKE_PREFIX_PATH="$HOME/.local" \
              -DCMAKE_CXX_FLAGS="-I$SPIRV_INC"
            cmake --build "$DIR/build-vulkan" --target llama-bench -j
          fi
          git -C "$DIR" rev-parse HEAD
      - name: Run the campaign (frozen protocol, quiet-host gate)
        env:
          # The box also enumerates the Raphael iGPU; pin llama.cpp to the
          # discrete device. geist's vk_pick_device prefers discrete itself.
          GGML_VK_VISIBLE_DEVICES: "0"
          GEIST_GGUF_PATH: ${{ vars.GEIST_GGUF_PATH }}
        run: |
          set -eo pipefail
          # The runner refuses any model whose SHA-256 differs from the
          # protocol's, so pick the candidate by that hash: the repo variable
          # first (it points at the CI fixture, not necessarily the campaign
          # model), then the box path the AMD campaign measured from.
          WANT=$(python3 -c "import json; print(json.load(open('benchmark/cross_engine_gpu_protocol.json'))['model']['sha256'])")
          MODEL=""
          for cand in "$GEIST_GGUF_PATH" \
                      "$HOME/workplace/geistlib/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf"; do
            if [ -f "$cand" ] && [ "$(sha256sum "$cand" | cut -d' ' -f1)" = "$WANT" ]; then
              MODEL="$cand"; break
            fi
          done
          [ -n "$MODEL" ] || { echo "no candidate matches the protocol model SHA $WANT"; exit 1; }
          echo "campaign model: $MODEL"
          python3 tools/bench_cross_engine.py \
            --geist bin/linux/release/tests/bench_perf_sweep \
            --llama "$HOME/llama.cpp-cross-engine/build-vulkan/bin/llama-bench" \
            --gguf "$MODEL" \
            --protocol benchmark/cross_engine_gpu_protocol.json \
            --host-profile nvidia_2080ti_vulkan \
            --out-dir bench-out
      - name: Upload raw artifact + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engine-vulkan-2080ti
          path: bench-out/
          if-no-files-found: error
