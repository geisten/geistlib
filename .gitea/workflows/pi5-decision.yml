# Gemma 4 E2B decision fixtures on the Pi 5 (#694, #698): candidate logits
# from geist cpu_neon and the cpu_scalar full-precision oracle on the board,
# against geist-runtime's frozen reference. Evidence only: the job fails on a
# crash, never on a logit gap. Make and C only; no llama.cpp leg.
#
# Cortex-A76 has dotprod but no i8mm, so cpu_neon may take a different
# kernel path than the Apple run that produced the fixture's geist numbers.
# bench_decision hard-codes an FP32 KV cache, so what's left is the
# weight/activation path.
name: pi5-decision

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "geistlib ref to check out"
        default: main
      runtime_ref:
        description: "geist-runtime ref holding tests/fixtures/decisions"
        default: main

permissions:
  contents: read

concurrency:
  group: pi5
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: pi5
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: checkout geisten/geist-runtime into runtime/
        env:
          REF: ${{ inputs.runtime_ref }}
        run: git clone -q --depth 1 --filter=blob:none --sparse --branch "$REF" https://github.com/geisten/geist-runtime runtime && git -C runtime sparse-checkout set tests/fixtures/decisions
      - name: fixture model (SHA-gated, the fixture's artifact_sha256)
        run: make fetch-model
      - name: build bench_decision (DECISION=1)
        run: ~/bin/with-pi-lock make TARGET=pi5 DECISION=1 bin/pi5/release/tools/bench_decision
      # bench_decision's wire format: n_prompt n_candidates ids... cands...
      - name: wire input from the fixture
        run: |
          echo "OUT=$RUNNER_TEMP/decision" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/decision" && mkdir -p "$OUT"
          python3 - runtime/tests/fixtures/decisions/gemma4.json > "$OUT/wire.txt" <<'EOF'
          import json, sys
          for c in json.load(open(sys.argv[1]))["cases"]:
              print(len(c["ids"]), len(c["candidate_ids"]), *c["ids"], *c["candidate_ids"])
          EOF
      - name: geist cpu_neon and cpu_scalar
        run: |
          for be in cpu_neon cpu_scalar; do
            OMP_NUM_THREADS=4 ~/bin/with-pi-lock bin/pi5/release/tools/bench_decision \
              gguf_artifacts/gemma4-e2b-Q4_K_M.gguf "$be" 512 4 2 0 1 --modes decision_dense \
              < "$OUT/wire.txt" > "$OUT/geist-$be.jsonl"
          done
      - name: summary
        run: |
          python3 - runtime/tests/fixtures/decisions/gemma4_numeric.json "$OUT" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys, pathlib
          ref, out = json.load(open(sys.argv[1]))["outputs"], pathlib.Path(sys.argv[2])
          rows = lambda p: [json.loads(l) for l in p.read_text().splitlines() if l.startswith("{")]
          runs = {"fixture reference (arm64 macOS)": ref}
          for be in ("cpu_neon", "cpu_scalar"):
              runs[f"geist {be} pi5"] = [r for r in rows(out / f"geist-{be}.jsonl")
                                         if r.get("kind") == "sample" and r.get("phase") == "first"]
          print("| run | fixture 0 | fixture 1 | fixture 2 |\n|---|---|---|---|")
          for name, cases in runs.items():
              cells = [", ".join(f"{x:.2f}" + ("✓" if i == c["best_index"] else "")
                                 for i, x in enumerate(c["logits"])) for c in cases]
              print(f"| {name} | " + " | ".join(cells) + " |")
          EOF
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 14
          name: pi5-decision-${{ github.run_id }}
          path: ${{ runner.temp }}/decision/
          if-no-files-found: ignore
