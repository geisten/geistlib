name: zz-debug-attn
# temporary: which flag makes the int8 attention tests fail in MODE=cov on x86
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-install
        with:
          packages: gcc-14 libopenblas-dev
      - run: |
          set +e
          t=test_x86_attention_int8_unit
          variant() {  # name, CFLAGS_MODE, extra target flags
            rm -rf build/linux/release bin/linux/release
            make -s MODE=release TARGET=linux CC=gcc-14 CFLAGS_MODE="$2" EXTRA_CFLAGS="$3" LDFLAGS_MODE="$4" bin/linux/release/tests/$t >/dev/null 2>&1 || { echo "$1: build failed"; return; }
            bin/linux/release/tests/$t > /tmp/o.txt 2>&1; rc=$?
            echo "$1: exit=$rc fails=$(grep -c FAIL /tmp/o.txt)"
          }
          variant "O1+coverage+no-finite-math-only" "-O1 -g --coverage" "-fno-finite-math-only" "--coverage"
          variant "O1+coverage+fno-reciprocal-math"   "-O1 -g --coverage" "-fno-reciprocal-math" "--coverage"
          variant "O1+coverage+fno-associative-math"  "-O1 -g --coverage" "-fno-associative-math" "--coverage"
