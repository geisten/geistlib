name: vulkan-ab

# End-to-end A/B of two revisions on one Vulkan device of the self-hosted
# geist-vulkan box (docs/CI_SELF_HOSTED.md), with tools/bench_revision_ab.py
# on a synthetic model (tools/gen_synth_gguf.py), so no model download is
# needed. The box is a Ryzen 9 9950X, so `backend: cpu_x86` measures its
# Zen 5 CPU instead.
# The box enumerates the discrete GPU (NVIDIA), the Ryzen iGPU (RADV, AMD's
# wave64 hardware) and llvmpipe; `driver` picks one by its vulkaninfo
# driverID, so a vendor-specific path can be measured on the device it is
# for. The report goes to the job summary and, with the raw runs, to an
# artifact.
#
# A layer-split change (#49) runs on a real GGUF that does not fit the card:
# `model_url` + `model_sha256` replace the synthetic model, `split` puts
# those layers on the GPU (Vulkan) next to `backend` and first runs the
# split's correctness tests on `new` (two cpu_x86 instances byte-identical,
# fault injection, Vulkan reported), and `env` adds variables for the bench:
#   -i base=origin/main -i new=origin/<branch> -i seq_lens=512 -i cycles=8 \
#   -i model_url=https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/530227a7d994db8eca5ab5ced2fb692b614357fd/Qwen3-14B-Q8_0.gguf \
#   -i model_sha256=a0dfe649137410b7d82f06a209240508e218f32f5b6fd81b69d6932160cfcd9d \
#   -i split=26 -i 'env=GEIST_OFFLOAD_M_MIN=0;GEIST_M_MAX=128'
#
# On demand only. The defaults are #504's case (the Zen 5 CPU on a Q8_0
# model, main before the native Q8_0 kernels of #512 against main now).

on:
  workflow_dispatch:
    inputs:
      base:
        description: "baseline revision"
        type: string
        default: 7a0b4217568697f7787634d7f519c989b571897a
      new:
        description: "revision to compare"
        type: string
        default: origin/main
      backend:
        description: "GEIST_BENCH_BACKEND: vulkan, or a CPU backend (cpu_x86) to measure the box's Zen 5 CPU"
        type: string
        default: cpu_x86
      driver:
        description: "vulkan only: vulkaninfo driverID substring of the device to measure (RADV, NVIDIA, ...)"
        type: string
        default: RADV
      preset:
        description: "gen_synth_gguf.py preset"
        type: string
        default: smollm2-360m-q8_0
      seq_lens:
        description: "prefill lengths"
        type: string
        default: "128,512"
      cycles:
        description: "A/B cycles (>= 6)"
        type: string
        default: "6"
      model_url:
        description: "real GGUF instead of the synthetic preset (cached by file name; empty: preset)"
        type: string
        default: ""
      model_sha256:
        description: "sha256 of model_url"
        type: string
        default: ""
      split:
        description: "layers on the GPU (layer split, Vulkan next to backend; empty: no split)"
        type: string
        default: ""
      env:
        description: "extra VAR=VALUE for the bench, separated by ; (e.g. GEIST_OFFLOAD_M_MIN=64)"
        type: string
        default: ""

jobs:
  ab:
    name: A/B on geist-vulkan (${{ inputs.backend }} ${{ inputs.driver }})
    runs-on: geist-vulkan
    timeout-minutes: 180
    env:
      BASE: ${{ inputs.base }}
      NEW: ${{ inputs.new }}
      BACKEND: ${{ inputs.backend }}
      DRIVER: ${{ inputs.driver }}
      PRESET: ${{ inputs.preset }}
      SEQ_LENS: ${{ inputs.seq_lens }}
      CYCLES: ${{ inputs.cycles }}
      MODEL_URL: ${{ inputs.model_url }}
      MODEL_SHA: ${{ inputs.model_sha256 }}
      SPLIT: ${{ inputs.split }}
      EXTRA_ENV: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both revisions must resolve locally
      - name: Pick the device
        if: env.BACKEND == 'vulkan'
        run: |
          set -eo pipefail
          mkdir -p ab-out
          vulkaninfo --summary 2>&1 | tee ab-out/vulkan-env.txt
          # "GPUn:" opens a device block; take the first whose driverID matches.
          IDX=$(awk -v want="$DRIVER" '/^GPU[0-9]+:/ {gpu = substr($1, 4, length($1) - 4)}
                 /driverID/ && index($0, want) && gpu != "" {print gpu; exit}' ab-out/vulkan-env.txt)
          [ -n "$IDX" ] || { echo "no device with driverID matching '$DRIVER'"; exit 1; }
          echo "measuring GPU$IDX ($DRIVER)"
          echo "GEIST_VK_DEVICE=$IDX" >> "$GITHUB_ENV"
      - name: Synthetic model
        if: env.MODEL_URL == ''
        run: |
          python3 tools/gen_synth_gguf.py "$RUNNER_TEMP/synth.gguf" --preset "$PRESET"
          echo "MODEL=$RUNNER_TEMP/synth.gguf" >> "$GITHUB_ENV"
      - name: Model (cached outside the workspace, sha256-checked)
        if: env.MODEL_URL != ''
        run: |
          set -eo pipefail
          CACHE=${GEIST_MODEL_CACHE:-$HOME/geist-models}
          mkdir -p "$CACHE"
          F="$CACHE/$(basename "$MODEL_URL")"
          if [ ! -f "$F" ]; then
            curl -fL --retry 5 -C - -o "$F.part" "$MODEL_URL"
            echo "$MODEL_SHA  $F.part" | sha256sum -c -
            mv "$F.part" "$F"
          fi
          echo "MODEL=$F" >> "$GITHUB_ENV"
      - name: Split correctness on the new revision
        if: env.SPLIT != ''
        run: |
          set -eo pipefail
          mkdir -p ab-out
          git checkout -q "$NEW"
          make TARGET=linux BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native bin
          make fetch-llama-model
          bin/linux/release/tests/test_layer_split_int 2>&1 | tee ab-out/exact.txt
          bin/linux/release/tests/test_layer_split_fault_int 2>&1 | tail -5 | tee ab-out/fault.txt
          . scripts/gpu-lock.sh
          GEIST_SPLIT_BACKEND=vulkan GEIST_SPLIT_GGUF_PATH="$MODEL" GEIST_SPLIT_POINTS="$SPLIT" \
            bin/linux/release/tests/test_layer_split_int 2>&1 | grep -v '^geist vulkan: device memory' \
            | tee ab-out/vulkan.txt || true
          git checkout -q -
      - name: A/B
        run: |
          set -eo pipefail
          # bench_revision_ab builds and measures in one go, so the lock covers
          # its builds too (#706)
          . scripts/gpu-lock.sh
          mkdir -p ab-out
          git fetch origin main
          envs="--env GEIST_BENCH_BACKEND=$BACKEND"
          if [ -n "$SPLIT" ]; then
            # the split's GPU stage takes the default (discrete) device
            envs="$envs --env GEIST_BENCH_SPLIT_BACKEND=vulkan --env GEIST_BENCH_SPLIT_LAYERS=$SPLIT"
            decode_n=32
          else
            envs="$envs --env GEIST_VK_DEVICE=${GEIST_VK_DEVICE:-0}"
            decode_n=16
          fi
          for e in $(echo "$EXTRA_ENV" | tr ';' ' '); do envs="$envs --env $e"; done
          python3 tools/bench_revision_ab.py \
            --rev "base=$BASE" --rev "new=$NEW" \
            --gguf "$MODEL" --seq-lens "$SEQ_LENS" \
            --decode-n "$decode_n" --repeats 1 --warmup 1 --cycles "$CYCLES" $envs \
            --make-arg TARGET=linux --make-arg "BACKENDS=vulkan cpu_x86 cpu_scalar" \
            --make-arg GEMM_PROVIDER=native \
            --out-dir ab-out | tee ab-out/report.txt
      - name: Device line of each build
        if: env.BACKEND == 'vulkan'
        # GEIST_VK_VERBOSE names the device, its subgroup size and whether
        # the tiled GEMMs are pinned to 32 lanes.
        run: |
          for b in ab-out/*/bench_perf_sweep_*; do
            echo "== $(basename "$b")"
            GEIST_BENCH_BACKEND=vulkan GEIST_VK_VERBOSE=1 "$b" --gguf "$MODEL" \
              --seq-lens 16 --decode-n 1 --repeats 1 --warmup 0 2>&1 | grep -m1 "geist vulkan" || true
          done | tee -a ab-out/report.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```'; grep -E 'byte-identical|FAIL|PASS|kv .* split' ab-out/exact.txt ab-out/fault.txt ab-out/vulkan.txt 2>/dev/null | head -40
            cat ab-out/report.txt 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 14
          name: vulkan-ab
          path: ab-out/
          if-no-files-found: warn
