name: ci-hygiene

# CI hygiene on the desktop runner host (scripts/ci-hygiene.sh,
# docs/HARDWARE_CI.md "CI hygiene"): a user timer that removes stale
# action-cache index.lock files and prunes docker once a day. deploy
# installs or updates it and runs it once; status shows the timer and log.
# Dispatch only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy | status"
        default: status

permissions:
  contents: read

jobs:
  host:
    runs-on: geist-vulkan
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ${{ inputs.action }}
        run: sh scripts/ci-hygiene.sh "${{ inputs.action }}"
