# Gitea copy of .github/workflows/ci.yml, regenerated by scripts/gitea-ci.py
# when that file changes. Runners of the geisten org: ubuntu-24.04 = desktop
# (docker, 4 parallel), ubuntu-24.04-tsan = desktop (docker, see the tsan
# job), ubuntu-24.04-arm = Pi 5 (docker, one job at a time under the board
# lock), macos-15 = the M1 Max (host). No Intel Mac leg; the hardware tier is
# in its own workflows here (docs/HARDWARE_CI.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR. A push to main runs to the end:
# merges land faster than the 65 min coverage job, and with cancellation
# most main commits were never fully measured (perf record, coverage).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version-consistency:
    name: source version consistent; README follows latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sh -n scripts/check-version.sh scripts/check-release.sh scripts/check-published-release.sh
      - run: sh scripts/check-version.sh
      - name: Full release gate when the source version changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The trigger is the VERSION, not the header: any edit to include/geist.h
        # needs a CHANGELOG note (AGENT.md §6), so compare the version strings.
        run: |
          base_version=$(git show "$BASE_SHA":include/geist.h \
            | sed -n 's/^#define GEIST_VERSION_STRING "\(.*\)"/\1/p')
          head_version=$(sed -n 's/^#define GEIST_VERSION_STRING "\(.*\)"/\1/p' include/geist.h)
          if [ "$base_version" = "$head_version" ]; then
            echo "source version unchanged ($head_version) — release gate not applicable"
          else
            echo "source version $base_version -> $head_version — running the release gate"
            sh scripts/check-release.sh --pre-tag
          fi

  api-contract:
    name: API contract documented and STABLE (docs/API_CONTRACT.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/check-api-contract.sh
      # #236: audio matmul kernels are bound at load time from the hw probe;
      # a compile-time ISA branch returning to the forward pass fails here.
      - run: sh scripts/check-audio-dispatch.sh

  build-test:
    name: build + unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # ccache turns the recompile of ~38k lines into a near-no-op on a cache hit,
    # so each push only rebuilds what changed. Content-based (hashes the source),
    # unlike caching make's mtime-driven build/ dir.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    strategy:
      fail-fast: false
      matrix:
        include:
          # -std=c23 needs gcc >= 14 and Apple-clang >= 16 (Xcode 16 / macOS 15).
          # macOS builds the metal backend alongside the CPU pair (#181): the hosted
          # macos-15 runners expose a real Metal device, so the probe and parity gate
          # below execute on GPU.
          - name: macOS arm64
            runner: macos-15
            target: mac-omp
            cc: clang
            bflags: BACKENDS="metal cpu_neon cpu_scalar"
            apple_silicon: true
            perf_gguf: qwen3.5-0.8b-q8_0.gguf
            perf_floors: --min-prefill 30 --min-decode 10
          # No OpenMP (TARGET=mac): cpu_neon's loops run on GCD through
          # geist_par_for (#618). The only leg that executes that backend;
          # CPU pair only, so the Metal gate and perf floors stay with the
          # leg above.
          - name: macOS arm64 GCD (no OpenMP)
            runner: macos-15
            target: mac
            cc: clang
            bflags: BACKENDS="cpu_neon cpu_scalar"
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux
            cc: gcc-14
            bflags: ""
            perf_gguf: gemma4-e2b-Q4_K_M.gguf
            perf_floors: --min-prefill 20 --min-decode 4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unique key each run so the warmed cache is always saved; restore-keys
      # falls back to the latest prior cache for this matrix leg.
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp ccache
          # libomp lives under /opt/homebrew on Apple silicon, /usr/local on Intel.
          echo "LIBOMP_PREFIX=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache python3-numpy

      - name: Build
        run: make TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # Unit tests are hardware/kernel-level and do not need a GGUF model;
      # AUTO_FETCH_MODEL=0 keeps the ~3 GB reference download out of CI.
      - name: Unit tests
        run: make test-unit TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }} AUTO_FETCH_MODEL=0

      - name: Decision feature on/off (same build directory)
        run: make test-decision TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # Sanitizers on macOS, both arches: the asan legs are Linux+gcc only, and
      # clang fails differently at -O1 (an `omp simd` the sanitizer instrumentation
      # cannot satisfy is a -Wpass-failed error under -Werror). Model-free suite,
      # same backends as the release build above.
      - name: ASan + UBSan unit tests (macOS)
        if: runner.os == 'macOS'
        run: make MODE=asan test-unit TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }} AUTO_FETCH_MODEL=0

      - name: Decision feature on/off (ASan + UBSan)
        run: make MODE=asan test-decision TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # Mandatory GPU gate (#181): on macos-15 a Metal device is expected,
      # so a SKIP (exit 77) from either binary fails the step — a skipped
      # gate must not read as a green one. Registration, lifecycle, buffer
      # round-trip (probe) and linear parity vs cpu_scalar (every quant
      # format the test lists, decode and prefill shapes) all run on the
      # real device. The autorelease footprint bound (#527) runs from the
      # release build only: under ASan it skips by design.
      - name: Metal device probe + linear parity (GPU, mandatory)
        if: matrix.apple_silicon
        run: |
          ./bin/${{ matrix.target }}/release/tests/test_backend_metal_probe
          ./bin/${{ matrix.target }}/release/tests/test_backend_metal_parity_unit
          GEIST_TEST_METAL_RESOURCES=1 ./bin/${{ matrix.target }}/release/tests/test_metal_resources_unit
          GEIST_TEST_METAL_RESOURCES=1 ./bin/${{ matrix.target }}/asan/tests/test_metal_resources_unit
          GEIST_TEST_METAL_AUTORELEASE=1 ./bin/${{ matrix.target }}/release/tests/test_metal_autorelease_unit

      # Hermetic Python suite (algorithm reference impls). Part of `make test` (#146).
      - name: Python tests
        if: matrix.target == 'linux'
        run: make test-py

      # The BitNet embedding chain, executed end to end. Called directly, not via
      # `make test-embedding`, whose 77 is a benign skip without numpy: here numpy
      # is installed and the tool is built, so a skip is a failure.
      - name: Embedding chain end-to-end (synthetic model, a skip is a failure)
        if: matrix.target == 'linux'
        run: python3 tests/scripts/embedding_e2e_smoke.py bin/${{ matrix.target }}/release/tools/dump_geist_embedding

      # Contract enforcement, include half: every public header compiles on its
      # own as C23 and as C++17 (see GEIST_AT_LEAST in include/geist.h).
      - name: Public headers compile as C and C++
        run: make check-headers TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # Contract enforcement, link half: an out-of-tree agent runtime links
      # these symbols across a release boundary, so a changed signature or a
      # removed symbol must fail here rather than in the consumer's build.
      - name: Agent-runtime contract smoke
        run: make agent-contract-smoke TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # The same for the API geist-runtime builds on (#622).
      - name: geist-runtime contract smoke
        run: make runtime-contract-smoke TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

      # The integration + e2e suites load the real GGUF, so they actually exercise
      # the product path (forward pass, tokenizer, KV, the agent/chat loops) — the
      # unit suite cannot. Run them on Linux only and cache the ~3 GB model so it
      # downloads once; asset-gated tests (vision/audio/safetensors refs) SKIP.
      - name: Cache reference model
        if: matrix.target == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts
          key: geist-model-gemma4-e2b-q4km-v1

      # A second architecture family: the llama populator and its tokenizer mode.
      # 369 MB, cached under its own key derived from the content pin
      # (LLAMA_MODEL_SHA256 prefix), so re-pinning rotates the cache.
      - name: Cache Llama reference model
        if: matrix.target == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd

      - name: Fetch Llama reference model
        if: matrix.target == 'linux'
        run: make fetch-llama-model

      # Third architecture family (#275): qwen3 exercises the metadata
      # head_dim path (128 ≠ d_model/n_heads), per-head QK-norm, and the
      # qwen2 pretokenizer parity pins. 609 MB, own cache key.
      - name: Cache Qwen3 reference model
        if: matrix.target == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3-0.6b-q8_0.gguf
          key: geist-model-qwen3-0.6b-q8-9465e63a22ad

      - name: Cache Qwen3.5 reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3.5-0.8b-q8_0.gguf
          key: geist-model-qwen35-0.8b-q8-0ad885ffd4bb
      - name: Fetch Qwen3.5 reference model
        run: make fetch-qwen35-model
      - name: Fetch Qwen3 reference model
        if: matrix.target == 'linux'
        run: make fetch-qwen3-model

      # Integration on macOS (#441): the Accelerate/AMX and Metal product paths
      # on the cached qwen3.5 fixture — its family suite plus the model-agnostic
      # determinism and known-answer checks. Not the whole int suite: with
      # GEIST_GGUF_PATH at a qwen model, gemma-shaped tests fail on the fixture,
      # not the code (#452).
      - name: Integration tests on macOS (qwen3.5 fixture)
        if: runner.os == 'macOS'
        env:
          GEIST_GGUF_PATH: ${{ github.workspace }}/gguf_artifacts/qwen3.5-0.8b-q8_0.gguf
        run: |
          # The runner directly: `make test-int` hard-codes its "_int" filter.
          mk/run-tests.sh bin/${{ matrix.target }}/release/tests qwen35
          for t in test_prefill_determinism_int test_known_answer_e2e test_idle_cpu_int; do
            echo "=== $t ==="
            bin/${{ matrix.target }}/release/tests/$t
          done

      # GEIST_STRICT_FIXTURES=gguf turns "GGUF model not found" from a skip into
      # a failure. Scoped to this step: the only one where both models are
      # guaranteed present. The unit step runs AUTO_FETCH_MODEL=0 and must keep
      # skipping cleanly.
      - name: Integration + e2e tests (real models, fixtures mandatory)
        if: matrix.target == 'linux'
        env:
          GEIST_STRICT_FIXTURES: gguf
          # Skips outside this list fail (#443): the suite may not shrink quietly.
          GEIST_EXPECTED_SKIPS: .github/expected-skips.txt
        run: make test-int test-e2e TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}"

      # Dequant kernels vs gguf-py, bit-exact, on every GGUF this leg holds
      # (#440). Called directly, not via `make test-dequant`, whose 77 is a
      # benign skip for a contributor without the package: here the package
      # is installed and the models are present, so a skip is a failure.
      - name: Dequant parity vs gguf-py (bit-exact, a skip is a failure)
        if: matrix.target == 'linux'
        run: |
          python3 -m pip install --quiet --break-system-packages gguf
          python3 tests/scripts/validate_gguf_dequant.py gguf_artifacts/*.gguf

      # Build the shared object from the archive and run the ctypes example
      # against the small llama fixture: the README's no-shim FFI claim, checked.
      # The Rust/Go/JS examples share the same symbols.
      - name: FFI example (Python ctypes)
        if: matrix.target == 'linux'
        run: |
          cc -shared -o libgeist.so \
            -Wl,--whole-archive lib/linux/release/libgeist.a -Wl,--no-whole-archive \
            -fopenmp -lm
          python3 examples/ffi/generate.py ./libgeist.so \
            gguf_artifacts/smollm2-360m-instruct-q8_0.gguf "The capital of France is" | head -c 400

      # Coarse perf-regression gate on the (noisy) shared runner: generous floors
      # catch a cliff — scalar fallback, -O0, OpenMP off, an early-return kernel —
      # not drift. The Pi 5 stays the precise arbiter. perf_gate --record puts
      # this run's numbers in the step summary next to the last main run's (#442);
      # saved on main only, so a PR never becomes the reference.
      - name: Last main perf numbers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-last
          key: perf-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: perf-${{ matrix.name }}-
      # The model and floors are matrix fields. Linux gates the Q4_K gemma4
      # reference; the Apple leg (#327) the qwen3.5 0.8B Q8_0 it already caches.
      # Apple runner numbers spread 1.8x across runs of the same code, so its
      # floors are ~40% of the WORST observed run: the cliffs this gate exists
      # for are multiples, not percentages. Raise them only with enough samples.
      - name: Perf regression gate (${{ matrix.perf_gguf }})
        if: matrix.perf_gguf
        run: |
          bin/${{ matrix.target }}/release/tests/bench_perf_sweep \
            --gguf gguf_artifacts/${{ matrix.perf_gguf }} \
            --seq-lens 128 --decode-n 16 --warmup 4 --repeats 3 \
            | python3 benchmark/perf_gate.py ${{ matrix.perf_floors }} --record perf-last/main.json
      - name: Save perf numbers for the next comparison (main only)
        if: github.ref == 'refs/heads/main' && hashFiles('perf-last/main.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-last
          key: perf-${{ matrix.name }}-${{ github.run_id }}

      - name: Build example
        run: make -C examples TARGET=${{ matrix.target }} CC="ccache ${{ matrix.cc }}" ${{ matrix.bflags }}

  # Build the way the README tells a newcomer to, in images nobody develops
  # on. The point of this job is what it does NOT pass: no EXTRA_CFLAGS, no
  # GEMM_PROVIDER, no bash in the image — only the prerequisites the README
  # states (gcc >= 14 and make) and the command it prints. `lib` on purpose:
  # it is the README's first command and needs no BLAS.
  readme-build:
    name: documented build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 and Alpine 3.21 are the two images the README claims to
          # have been verified in; they must build with the printed command.
          - image: debian:13
            setup: apt-get update -qq && apt-get install -y -qq build-essential
            build: make lib
          - image: alpine:3.21
            setup: apk add --no-cache build-base
            build: make lib
          # Ubuntu 24.04 ships gcc 13, which predates -std=c23. The README prescribes
          # gcc-14 + CC=gcc-14; this asserts that recipe works.
          - image: ubuntu:24.04
            setup: apt-get update -qq && apt-get install -y -qq gcc-14 make
            build: make CC=gcc-14 lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ${{ matrix.build }} in a clean ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} sh -c '
            set -e
            ${{ matrix.setup }} >/dev/null
            ${{ matrix.build }}
          '

  build-test-musl:
    name: build + unit tests (Linux arm64, musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build + unit tests (musl in Alpine)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers bash
            FLAGS="TARGET=linux CC=gcc GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE"
            make $FLAGS                                 # builds lib + all test/demo binaries
            make test-unit $FLAGS AUTO_FETCH_MODEL=0    # run the model-free unit suite
          '

  # Cover the shipped x86_64 path (release.yml linux-x86_64: cpu_x86,
  # runtime-dispatched over an x86-64-v3 baseline) with unit + int + e2e.
  # Hosted runners don't guarantee AVX-512, so the CPU feature check reports
  # whether the AVX-512 kernels ran; build-test-x86_64-scalar covers the
  # SIMD-free path. Two legs in parallel: the full suite, and the int suite
  # once more under GEIST_FORCE_ISA=avx2 — sequential they were the slowest
  # job of every PR run.
  build-test-x86_64:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: full
            name: build + tests (Linux x86_64, cpu_x86 AVX-512 + scalar)
          - leg: avx2
            name: integration tests (Linux x86_64, cpu_x86 forced AVX2)
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report CPU features (was AVX-512 exercised on this runner?)
        run: |
          sed -n 's/^model name.*: //p' /proc/cpuinfo | head -1
          if grep -q avx512 /proc/cpuinfo; then
            echo "AVX-512: PRESENT -> the cpu_x86 AVX-512 kernels are exercised."
          else
            echo "AVX-512: ABSENT -> runtime dispatch falls back to AVX2/scalar (no SIGILL); AVX-512 kernels built but not run here."
          fi
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-x86_64-${{ github.run_id }}
          restore-keys: ccache-x86_64-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 ccache
      # Same backends/GEMM as the shipped release binary (release.yml linux-x86_64).
      - name: Build
        run: make TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native
      - name: Unit tests
        if: matrix.leg == 'full'
        run: make test-unit TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native AUTO_FETCH_MODEL=0
      - name: Cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts
          key: geist-model-gemma4-e2b-q4km-v1
      # Same llama fixture + strictness as the arm64 leg: #180 requires the
      # llama tests to PASS on both Linux arches, and a skip must not count.
      - name: Cache Llama reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: Fetch Llama reference model
        run: make fetch-llama-model
      - name: Cache Qwen3 reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3-0.6b-q8_0.gguf
          key: geist-model-qwen3-0.6b-q8-9465e63a22ad
      - name: Cache Qwen3.5 reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3.5-0.8b-q8_0.gguf
          key: geist-model-qwen35-0.8b-q8-0ad885ffd4bb
      - name: Fetch Qwen3.5 reference model
        run: make fetch-qwen35-model
      - name: Fetch Qwen3 reference model
        run: make fetch-qwen3-model
      - name: Integration + e2e tests (real models, fixtures mandatory)
        if: matrix.leg == 'full'
        env:
          GEIST_STRICT_FIXTURES: gguf
          # Skips outside this list fail (#443): the suite may not shrink quietly.
          GEIST_EXPECTED_SKIPS: .github/expected-skips.txt
        run: make test-int test-e2e TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native
      # Portability gate (#96): GEIST_FORCE_ISA=avx2 clamps the kernel
      # dispatcher to the x86-64-v3 baseline, so the non-AVX512 code paths
      # (AVX2 Q4_Kx8 GEMV, scalar W8A8) run a real Q4_K prefill+decode even
      # when the runner CPU has AVX-512. Guards regressions where an AVX-512
      # kernel gets installed without a runtime CPU check (SIGILL on v3 CPUs).
      - name: Integration tests, non-AVX512 dispatch (GEIST_FORCE_ISA=avx2)
        if: matrix.leg == 'avx2'
        run: GEIST_FORCE_ISA=avx2 make test-int TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native
      # Coarse perf cliff detector for cpu_x86 on the hermetic synthetic
      # Llama 3.2 1B Q4_K (tools/gen_synth_gguf.py; written outside gguf_artifacts
      # so the model cache never stores it). Floors are ~25% of a 4-vCPU x86 VM
      # (prefill ~160, decode ~32 tok/s); the scalar backend gives 3.9 / 1.4.
      # perf_gate --record as on the arm64 leg (#442).
      - name: Last main perf numbers (x86, synthetic)
        if: matrix.leg == 'full'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-last
          key: perf-x86_64-synth-${{ github.run_id }}
          restore-keys: perf-x86_64-synth-
      - name: Perf regression gate (x86, synthetic Q4_K)
        if: matrix.leg == 'full'
        run: |
          python3 tools/gen_synth_gguf.py "$RUNNER_TEMP/llama32-1b-q4_k.gguf" --preset llama32-1b-q4_k
          bin/linux/release/tests/bench_perf_sweep \
            --gguf "$RUNNER_TEMP/llama32-1b-q4_k.gguf" \
            --seq-lens 128 --decode-n 16 --warmup 4 --repeats 3 \
            | python3 benchmark/perf_gate.py --min-prefill 40 --min-decode 8 --record perf-last/main.json
      - name: Save perf numbers for the next comparison (main only, x86)
        if: matrix.leg == 'full' && github.ref == 'refs/heads/main' && hashFiles('perf-last/main.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: perf-last
          key: perf-x86_64-synth-${{ github.run_id }}

  # Guarantee the SIMD-free portable reference builds + passes on x86_64,
  # independent of whatever SIMD the runner CPU happens to have. This is the
  # baseline every other x86 kernel is checked against; if it drifts, quantized
  # correctness is unmoored.
  build-test-x86_64-scalar:
    name: build + unit tests (Linux x86_64, cpu_scalar portable reference)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14
      - name: Build + unit tests (scalar only, no SIMD)
        run: |
          make TARGET=linux CC=gcc-14 BACKENDS="cpu_scalar" GEMM_PROVIDER=native
          make test-unit TARGET=linux CC=gcc-14 BACKENDS="cpu_scalar" GEMM_PROVIDER=native AUTO_FETCH_MODEL=0

  # clang on x86_64. Every other x86_64 leg uses gcc: clang outlines an
  # OpenMP `parallel for` body into a function that does not inherit the
  # kernel's target attribute, which aborted instruction selection before
  # #415. Build + unit tests suffice — the failure mode is a compile abort.
  # libomp-19-dev provides omp.h; libclang-rt-19-dev the sanitizer runtime
  # -fsanitize=fuzzer needs (libclang-common-19-dev only recommends it).
  build-test-x86_64-clang:
    name: build + unit tests (Linux x86_64, clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: clang-19 libomp-19-dev libclang-rt-19-dev
      - name: Build + unit tests (release backends, clang)
        run: |
          make TARGET=linux CC=clang-19 BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native
          make test-unit TARGET=linux CC=clang-19 BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native AUTO_FETCH_MODEL=0

      # Coverage-guided fuzzing needs clang, so it rides along here. MODE=fuzz
      # rebuilds the library with -fsanitize=fuzzer-no-link into its own tree.
      # The corpus is seeded by the harness itself. UBSan halts, as in the
      # deterministic gate: in recover mode libFuzzer runs on to a green exit.
      - name: Fuzz harnesses (libFuzzer, 30 s per target)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make fuzz-libfuzzer TARGET=linux CC=clang-19 FUZZ_CC=clang-19 BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native FUZZ_SECONDS=30

  # Audio harness smoke (#234): runs bench_audio_encode and
  # test_audio_latency_e2e, which SKIP elsewhere for missing fixtures. The
  # audio tower is Range-extracted and SHA-pinned (tools/fetch_audio_tower.py,
  # cached), mel constants are checked in, the clip is synthesized
  # (tools/gen_test_wav.py). arm64 for the NEON / Pi 5 code path. A skip fails
  # the step; no timing is asserted.
  audio-smoke:
    name: audio harness smoke (Linux arm64, NEON)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-audio-smoke-${{ github.run_id }}
          restore-keys: |
            ccache-audio-smoke-
            ccache-Linux arm64-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache
      - name: Build
        run: make TARGET=linux CC="ccache gcc-14" bin
      - name: Cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts
          key: geist-model-gemma4-e2b-q4km-v1
      - name: Fetch reference model
        run: make fetch-model
      - name: Cache audio tower
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audio_bench/audio_tower.safetensors
          key: geist-audio-tower-d6c45a6c2762
      - name: Fetch audio tower (Range-extracted, SHA-pinned)
        run: make fetch-audio-tower
      - name: Synthesize smoke clip
        run: python3 tools/gen_test_wav.py audio_test_data/smoke.wav 2.0
      - name: Audio encoder bench (a skip is a failure)
        run: ./bin/linux/release/tests/bench_audio_encode audio_test_data/smoke.wav
      # #247: >10 s audio must produce the full soft-token sequence.
      - name: Long-clip truncation guard (a skip is a failure)
        run: ./bin/linux/release/tests/test_audio_long_clip_int
      - name: Audio latency harness (a skip is a failure)
        env:
          GEIST_GGUF_PATH: ${{ github.workspace }}/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
          GEIST_AUDIO_WAV: audio_test_data/smoke.wav
        run: ./bin/linux/release/tests/test_audio_latency_e2e
      # #238: W8A8 attention/lconv must stay equivalent to the shipping
      # precision — the tower is present here, so a skip is a failure.
      - name: Attn/LConv W8A8 parity vs shipping precision (a skip is a failure)
        run: ./bin/linux/release/tests/test_audio_attn_w8a8_parity_int
      # #235: the live streaming worker must stay bit-identical to the
      # monolithic path.
      - name: Live streaming worker parity (a skip is a failure)
        run: ./bin/linux/release/tests/test_audio_stream_live_parity_int
      # #256: the public streaming turn must be greedy-equivalent to
      # attach_audio (capture-thread pattern included).
      - name: Session streaming turn equivalence (a skip is a failure)
        env:
          GEIST_GGUF_PATH: ${{ github.workspace }}/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf
        run: ./bin/linux/release/tests/test_audio_stream_session_int

  # x86_64 counterpart to audio-smoke: the AVX-512/VNNI audio path. Only the
  # tower is needed: the encoder runs without an LLM.
  audio-parity-x86_64:
    name: audio W8A8 parity (Linux x86_64, AVX-512 VNNI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-audio-parity-x86_64-${{ github.run_id }}
          restore-keys: |
            ccache-audio-parity-x86_64-
            ccache-build-test-x86_64-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache
      - name: Build
        run: make TARGET=linux CC="ccache gcc-14" bin
      # Same cache key as audio-smoke on purpose: one 614 MB entry serves both
      # legs instead of two, which the repo's 10 GB cache budget notices.
      - name: Cache audio tower
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audio_bench/audio_tower.safetensors
          key: geist-audio-tower-d6c45a6c2762
      - name: Fetch audio tower (Range-extracted, SHA-pinned)
        run: make fetch-audio-tower
      # The tower is present, so a skip (exit 77) fails the step.
      - name: Attn/LConv W8A8 parity vs shipping precision (a skip is a failure)
        run: ./bin/linux/release/tests/test_audio_attn_w8a8_parity_int

  # TARGET=pi5 is the primary deployment target (#244). The arm64 runner
  # compiles the exact pi5 flag set (-mcpu=cortex-a76 is a codegen choice,
  # not a run requirement). Build-only: the Pi 5 stays the arbiter for
  # anything measured.
  pi5-target-build:
    name: build (TARGET=pi5 flag set, Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-pi5-${{ github.run_id }}
          restore-keys: ccache-pi5-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache
      - name: Build lib + all test binaries
        run: make TARGET=pi5 CC="ccache gcc-14" lib bin

  # musl on x86_64: build-test-musl above only covers arm64, but the SHIPPED
  # x86_64 release artifact is also musl-static. Build + unit-test the exact
  # release recipe so a musl-specific x86 issue can't reach a release.
  build-test-musl-x86_64:
    name: build + unit tests (Linux x86_64, musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build + unit tests (musl in Alpine, cpu_x86 + scalar)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers bash
            make TARGET=linux CC=gcc BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE
            make test-unit TARGET=linux CC=gcc BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE AUTO_FETCH_MODEL=0
          '

  # GUARANTEED AVX-512/VNNI execution (#184). Hosted runners promise no
  # AVX-512 CPU, so build-test-x86_64 exercises those kernels only
  # opportunistically — a green run proves the AVX2 fallback, not the
  # shipped fast path. Intel SDE closes the gap deterministically: the
  # kernel binaries run under an emulated Sapphire Rapids
  # (AVX-512F/BW/DQ/VL + VNNI + BF16), and the leg cannot go green
  # without those paths executing:
  #   1. test_x86_isa_dispatch_unit runs FIRST with
  #      GEIST_EXPECT_ISA=avx512_vnni — it prints CPUID features + the
  #      dispatcher tier and HARD-FAILS on any silent downgrade (SDE
  #      missing, wrong chip model, clamp bug).
  #   2. The targeted W4A8/W8A8/Q4Kx8/Q6K/i2s and INT8-KV attention kernel
  #      unit tests then run under the same emulation; each carries its own
  #      scalar-reference parity checks. Whole-suite-under-SDE is
  #      deliberately out: 10-50× emulation overhead buys no additional SIMD
  #      coverage.
  # Real hardware runs nightly on git.geisten.net
  # (.gitea/workflows/native-avx512.yml): no self-hosted runner is attached
  # to this public mirror.
  avx512-sde:
    name: AVX-512/VNNI guaranteed (Linux x86_64, Intel SDE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-sde-${{ github.run_id }}
          restore-keys: ccache-sde-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 ccache
      - name: Install Intel SDE
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
      - name: Build (shipped x86_64 configuration)
        run: make TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native bin
      - name: Dispatcher proof — VNNI tier must actually be selected
        env:
          GEIST_EXPECT_ISA: avx512_vnni
        run: |
          "$SDE_PATH/sde64" -spr -- bin/linux/release/tests/test_x86_isa_dispatch_unit
      # #237: the audio tower's W8A8 binding must also pick VNNI under SDE
      # (and agree with the scalar kernel) — a silent fall-through to scalar
      # must fail here, not rot quietly.
      - name: Audio W8A8 binding proof — VNNI kernel selected + parity
        env:
          GEIST_EXPECT_AUDIO_KERNEL: avx512vnni
        run: |
          "$SDE_PATH/sde64" -spr -- bin/linux/release/tests/test_audio_linear_parity_unit
      - name: AVX-512 kernel tests under SDE (scalar-parity built in)
        run: |
          set -eo pipefail
          mkdir -p ci-diagnostics
          { echo "=== CPU (host, not what SDE emulates) ==="; lscpu || true; } \
            > ci-diagnostics/avx512-env.txt
          for t in test_x86_isa_dispatch_unit test_q4k_to_w4a8_unit \
                   test_q4k_to_q4kx8_unit test_q4kx8_gemm_unit \
                   test_q6k_gemv_unit test_q8w_gemv_unit test_f32q_unit \
                   test_i2s_gemv_unit test_gelu_x86_unit \
                   test_x86_kernel_no_alloc_unit test_x86_q8_0_unit \
                   test_x86_q4k_prefill_tail_unit test_x86_q6k_layout_unit \
                   test_x86_attention_int8_unit test_attention_int8_unit; do
            echo "=== $t (sde -spr) ==="
            "$SDE_PATH/sde64" -spr -- "bin/linux/release/tests/$t" 2>&1 \
              | tee -a ci-diagnostics/avx512-tests.txt
          done
      # The dispatcher tier this run actually selected is the evidence the
      # AVX-512 paths ran at all; keep it retrievable rather than buried in a
      # log that ages out. (#184)
      - name: Upload AVX-512 diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avx512-sde-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn

  # Vulkan on every PR (#182), software tier: Mesa's lavapipe is a real
  # Vulkan implementation (loader -> ICD -> SPIR-V pipeline), so the
  # registry, buffer and linear-parity tests execute the ACTUAL dispatch
  # chain on a hosted runner — no physical GPU required. The tests are
  # invoked directly: a SKIP (exit 77, e.g. loader or device missing)
  # fails the job instead of counting as green. The parity tolerances are
  # encoded in the test (1e-3 relative; 2e-2 for the f16 coopmat path,
  # which lavapipe may not expose). The same tests plus a model e2e run
  # on the physical GPU nightly on git.geisten.net
  # (.gitea/workflows/vulkan-gpu.yml).
  vulkan-lavapipe:
    name: Vulkan backend (Linux x86_64, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-vulkan-${{ github.run_id }}
          restore-keys: ccache-vulkan-
      - name: Install deps (loader, lavapipe ICD, headers)
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 ccache libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools
      # Kept as an artifact, not just a log line: lavapipe is a moving target
      # (Mesa updates land under us), so when this job goes red the first
      # question is what changed in the environment. if: always() so the
      # diagnostics survive exactly the run that needs them. (#182)
      - name: Report Vulkan environment
        run: |
          mkdir -p ci-diagnostics
          {
            echo "=== vulkaninfo --summary ==="
            vulkaninfo --summary 2>&1 || echo "vulkaninfo failed"
            echo
            echo "=== mesa / loader package versions ==="
            dpkg-query -W -f '${Package} ${Version}\n' \
              mesa-vulkan-drivers libvulkan1 libvulkan-dev 2>&1 || true
          } | tee ci-diagnostics/vulkan-env.txt
      - name: Build (vulkan + shipped x86 CPU backends)
        run: make TARGET=linux CC="ccache gcc-14" BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native bin
      - name: Vulkan tests on lavapipe (SKIP = failure)
        # pipefail is the load-bearing part: piping through `tee` would
        # otherwise hand back tee's exit code and every test would look green.
        # (-e is already GitHub's default for run steps; kept explicit so the
        # guarantee does not depend on that default.) Exit 77 (SKIP) fails the
        # job by construction.
        run: |
          set -eo pipefail
          for t in test_backend_vulkan_registry_unit \
                   test_backend_vulkan_buffer_unit \
                   test_backend_vulkan_linear_parity \
                   test_backend_vulkan_deltanet_unit \
                   test_fused_probe_agreement_unit \
                   test_backend_vulkan_dispatch_fail_unit \
                   test_backend_vulkan_scratch_placement_unit \
                   test_backend_vulkan_fallback_unit \
                   test_backend_vulkan_narrowing_unit \
                   test_backend_vulkan_vram_budget_unit \
                   test_backend_vulkan_pipeline_cache_unit \
                   test_backend_vulkan_weight_index_unit \
                   test_gguf_release_range_unit; do
            echo "=== $t ==="
            bin/linux/release/tests/"$t" 2>&1 | tee -a ci-diagnostics/vulkan-tests.txt
          done
      - name: Upload Vulkan diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulkan-lavapipe-diagnostics
          path: ci-diagnostics/
          if-no-files-found: warn

  # Build MODE=asan (-fsanitize=address,undefined) and run the model-free unit
  # suite. UBSAN_OPTIONS=halt_on_error makes UB a hard failure (UBSan only
  # logs by default); leak detection is off here (short-lived test binaries
  # don't free at exit).
  asan:
    name: ASan + UBSan (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-asan-${{ github.run_id }}
          restore-keys: ccache-asan-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache python3-numpy
      - name: ASan/UBSan unit tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0
        run: make MODE=asan test-unit TARGET=linux CC="ccache gcc-14" AUTO_FETCH_MODEL=0

      # Leak detection ON here: this leg loads a model and tears the session
      # down. Called directly, not via `make test-embedding`, whose 77 is a
      # benign skip without numpy: here numpy is installed and the tool is
      # built, so a skip is a failure.
      - name: ASan embedding chain (leak detection on, a skip is a failure)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: python3 tests/scripts/embedding_e2e_smoke.py bin/linux/asan/tools/dump_geist_embedding

  # The x86_64 leg of the same gate: the arm64 job never compiles the
  # cpu_x86 kernels or their tests. Same backends and GEMM as
  # build-test-x86_64 (the release binary). Leak detection is ON: the x86_64
  # unit suite is leak-clean.
  asan-x86_64:
    name: ASan + UBSan (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-asan-x86_64-${{ github.run_id }}
          restore-keys: ccache-asan-x86_64-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 ccache
      - name: ASan/UBSan unit tests (leak detection on)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: make MODE=asan test-unit TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native AUTO_FETCH_MODEL=0

      # Deterministic fuzz gate, in this job because the sanitizer tree it needs
      # is already built by the step above: 3000 runs per target cost under a
      # second. Fixed seed, so a failure reproduces from the log without a
      # crash artifact. The coverage-guided run lives in the clang job.
      - name: Fuzz harnesses (deterministic, ASan/UBSan)
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: make MODE=asan fuzz TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native

  # The concurrent-session contract (#183): distinct sessions of one model may
  # run from different threads. This leg proves it on the x86 backend. Only
  # the two multi-session tests run; a full suite under TSan would blow the
  # job budget for no extra cross-session coverage.
  tsan:
    name: TSan multi-session (Linux x86_64, cpu_x86)
    # desktop-tsan: its containers may call personality(ADDR_NO_RANDOMIZE), so
    # setarch -R runs the binaries without ASLR — gcc-14's TSan aborts on the
    # host's 32-bit mmap entropy ("unexpected memory mapping")
    runs-on: ubuntu-24.04-tsan
    # TSan is 5-15x on top of -O1 and serialized OMP: the parallel test's
    # serial reference prefill dominates. 75 min fits it with headroom.
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-tsan-${{ github.run_id }}
          restore-keys: ccache-tsan-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 ccache
      - name: Cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts
          key: geist-model-gemma4-e2b-q4km-v1
      # Build ONLY the two multi-session binaries (file targets), not `bin`:
      # the cross-session races live in engine/arch/backend code these two
      # exercise, and building 100+ test TUs under -fsanitize=thread buys
      # nothing but wall-clock and -O1-only warning noise in unrelated tests.
      - name: Build (TSan) + fetch model
        run: |
          make MODE=tsan TARGET=linux CC="ccache gcc-14" BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native EXTRA_CFLAGS=-D_GNU_SOURCE \
            bin/linux/tsan/tests/test_multi_session_parallel_int \
            bin/linux/tsan/tests/test_session_cancel_unit \
            bin/linux/tsan/tests/test_par_for_unit
          make fetch-model
      - name: Multi-session tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        # Only the PARALLEL test: the serial interleave variant runs in the
        # regular int suites and exercises no concurrency. GEIST_TEST_LIGHT
        # cuts decode to 8 tokens: every step runs the same code, so TSan
        # sees the same races, and the job drops from 11-24 to ~5-9 min.
        # The full 32-token bit-identity check runs in the regular int suites.
        # GEIST_TEST_NO_SERIAL_REF skips the serial rerun (no concurrency,
        # 2/3 of the remaining time); the int suites keep it too.
        run: |
          export GEIST_GGUF_PATH="$PWD/gguf_artifacts/gemma4-e2b-Q4_K_M.gguf"
          GEIST_TEST_LIGHT=1 GEIST_TEST_NO_SERIAL_REF=1 setarch "$(uname -m)" -R bin/linux/tsan/tests/test_multi_session_parallel_int
          # geist_session_cancel from a second thread (#628)
          setarch "$(uname -m)" -R bin/linux/tsan/tests/test_session_cancel_unit
          # geist_par_for's pthread pool (no OpenMP here), concurrent callers (#618)
          setarch "$(uname -m)" -R bin/linux/tsan/tests/test_par_for_unit

  # Coverage ratchet (#185): line+branch per subsystem against versioned
  # baselines (benchmark/coverage_baselines.json), gated by
  # scripts/coverage_gate.py. One reproducible run: model-free unit suite
  # plus the real-model int suite with fixtures mandatory — a fixture
  # skip would silently hollow out the measurement, so it fails instead.
  # Scope: the portable engine (src/base, engine, io, formats, quant,
  # archs/transformer, archs/audio_conformer, archs/vision_siglip,
  # backends/common, backends/cpu_scalar). Excluded from
  # the GATE (still visible in the report): cpu_neon (SIMD leg, only this
  # runner family executes it), cpu_x86/metal/vulkan (cannot execute on
  # this runner), third_party and generated *_spv.h (not ours). The control
  # test tests/test_coverage_gate_py.py proves the gate actually fires.
  coverage:
    name: coverage ratchet (Linux arm64, unit + int)
    # Not on pull_request: the instrumented run takes 60-100 minutes. It runs
    # on every push to main (and on dispatch), so a coverage drop is caught
    # one merge later.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    # The instrumented -O1 build prefills the real model many times across
    # the int suite. e2e adds ~half an hour and moves the per-subsystem
    # numbers only by noise, so the measurement is unit + int.
    timeout-minutes: 100
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-cov-${{ github.run_id }}
          restore-keys: ccache-cov-
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 libopenblas-dev ccache gcovr
      - name: Cache reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts
          key: geist-model-gemma4-e2b-q4km-v1
      # test-unit runs first under GEIST_STRICT_FIXTURES with no model
      # prerequisite, so fetch here in case the cache was evicted. No-op on a
      # cache hit.
      - name: Fetch reference model
        run: make fetch-model
      # The audio engine paths (attach + the #256 streaming turn) only
      # execute with the tower present — without it their session.c lines
      # count as uncovered and the src/engine floor fires. Same pinned
      # cache the audio-smoke job uses.
      - name: Cache audio tower
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audio_bench/audio_tower.safetensors
          key: geist-audio-tower-d6c45a6c2762
      - name: Fetch audio tower
        run: make fetch-audio-tower
      - name: Cache Llama reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/smollm2-360m-instruct-q8_0.gguf
          key: geist-model-smollm2-360m-q8-48ab3034d0dd
      - name: Fetch Llama reference model
        run: make fetch-llama-model
      - name: Cache Qwen3 reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3-0.6b-q8_0.gguf
          key: geist-model-qwen3-0.6b-q8-9465e63a22ad
      - name: Cache Qwen3.5 reference model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gguf_artifacts/qwen3.5-0.8b-q8_0.gguf
          key: geist-model-qwen35-0.8b-q8-0ad885ffd4bb
      - name: Fetch Qwen3.5 reference model
        run: make fetch-qwen35-model
      - name: Fetch Qwen3 reference model
        run: make fetch-qwen3-model
      - name: Build + run suites (MODE=cov, fixtures mandatory)
        env:
          GEIST_STRICT_FIXTURES: gguf
          # Repetition-heavy int tests honor this by shrinking their loop
          # counts: line coverage is identical (same code paths), but the
          # instrumented -O1 build stops paying 24 min for 4x32x2 parallel
          # decodes (races are the TSan job's business, not this one's).
          GEIST_TEST_LIGHT: 1
        run: |
          make MODE=cov TARGET=linux CC="ccache gcc-14" test-unit
          make MODE=cov TARGET=linux CC="ccache gcc-14" test-int
      - name: Coverage report + gate
        run: |
          mkdir -p coverage/html
          gcovr --root . --gcov-executable gcov-14 --filter 'src/' \
            --exclude 'src/backends/vulkan/' --exclude 'src/backends/metal/' \
            --exclude 'src/backends/cpu_x86/' \
            --gcov-ignore-parse-errors negative_hits.warn \
            --json coverage/coverage.json --xml coverage/cobertura.xml \
            --html-details coverage/html/index.html \
            build/linux/cov
          python3 scripts/coverage_gate.py coverage/coverage.json \
            --baselines benchmark/coverage_baselines.json
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Hard gate: the tree is clang-format-clean (clang-format 22.1.x), enforced.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin clang-format to the version the tree is formatted with — apt's
      # clang-format on ubuntu-24.04 is v18, which disagrees with the v22
      # formatting and would flag spurious drift. The pip package gives the
      # exact version on PATH (/usr/local/bin).
      - name: Install clang-format 22 (matches the tree)
        run: sudo python3 -m pip install --break-system-packages clang-format==22.1.5
      - name: Check formatting
        run: |
          clang-format --version
          make format-check
