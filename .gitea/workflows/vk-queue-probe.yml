name: vk-queue-probe

# One-off (#78 phase 2): the queue families of the geist-vulkan box's GPU,
# to see whether a transfer-only family (the copy engines) exists. Not for main.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: geist-vulkan
    timeout-minutes: 10
    steps:
      - name: Queue families
        run: |
          vulkaninfo 2>/dev/null | awk '/^GPU[0-9]|deviceName|driverName/{print} /VkQueueFamilyProperties/{f=1} f&&/queueFamilyProperties\[|queueCount|queueFlags|timestampValidBits/{print} /VkPhysicalDeviceMemoryProperties/{f=0}' | head -80
