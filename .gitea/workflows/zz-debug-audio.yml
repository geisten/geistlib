name: zz-debug-audio
# temporary: why test_audio_attn_w8a8_parity_int fails in MODE=cov on x86
on: workflow_dispatch
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apt-install
        with:
          packages: gcc-14 libopenblas-dev
      - name: Cache audio tower
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: audio_bench/audio_tower.safetensors
          key: geist-audio-tower-d6c45a6c2762
      - run: make fetch-audio-tower
      - run: |
          set +e
          t=test_audio_attn_w8a8_parity_int
          variant() {  # name, CFLAGS_MODE, late flags, LDFLAGS_MODE
            rm -rf build/linux/release bin/linux/release lib/linux/release
            make -s MODE=release TARGET=linux CC=gcc-14 CFLAGS_MODE="$2" EXTRA_CFLAGS="$3" LDFLAGS_MODE="$4" bin/linux/release/tests/$t >/dev/null 2>&1 || { echo "$1: build failed"; return; }
            GEIST_STRICT_FIXTURES=gguf bin/linux/release/tests/$t > /tmp/o.txt 2>&1; rc=$?
            echo "$1: exit=$rc"; grep -E "FAIL|PASS|mean|worst|cos" /tmp/o.txt | head -12
          }
          variant "release (O3)"                 "-O3 -DNDEBUG" "" ""
          variant "cov as in CI"                 "-O1 -g --coverage" "-fno-reciprocal-math" "--coverage"
          variant "O1 plain"                     "-O1 -g" "" ""
          variant "O1+cov+no-fast-math"          "-O1 -g --coverage" "-fno-fast-math" "--coverage"
          variant "O2+cov"                       "-O2 -g --coverage" "-fno-reciprocal-math" "--coverage"
