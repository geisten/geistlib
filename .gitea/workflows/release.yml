name: Release

# Build, verify and publish a geistlib release from git.geisten.net.
# Public downloads live on https://geisten.net/download/geistlib/ (one
# directory per version plus latest -> that version); the Gitea release in
# this private repo is the record with the same files. GitHub gets no new
# releases; its old ones stay.
# A maintainer dispatches this once from main. It pins that exact SHA, builds
# every platform on the geisten org's runners (Pi: linux-arm64, desktop:
# linux-x86_64, Mac: macos-arm64), drafts the Gitea release, uploads the
# files to geisten.net, verifies them over HTTPS against SHA256SUMS, and only
# then publishes the Gitea release (which creates the tag) and moves latest.
# dry_run=true does all of it into download/geistlib/rehearsal/ instead, under
# no tag, and deletes the draft: a full rehearsal that publishes nothing.
# Not carried over from the GitHub workflow: the BitNet-embedded CLIs
# (1.1 GB each; the slim CLI plus a downloaded GGUF does the same, and the
# apps download their models themselves), the Sigstore provenance (GitHub
# OIDC only) and the protected environment.
# Org secret DOWNLOAD_SSH_KEY: may only rsync into /var/www/htdocs/
# www.geisten.net/download on the web server (rrsync -wo in authorized_keys).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the v prefix (for example 0.21.0). Must match include/geist.h.'
        required: true
        type: string
      ref:
        description: 'Source ref. Releases must resolve to the current main tip.'
        required: true
        default: main
        type: string
      dry_run:
        description: 'Rehearsal: build and upload to download/geistlib/rehearsal/, publish nothing.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-guard:
    name: pin main SHA and validate release candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve and validate the candidate
        id: candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          git fetch -q --tags origin main
          sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          test "$sha" = "$main_sha" || {
            echo "::error::release ref resolves to $sha, but current main is $main_sha"
            exit 1
          }
          hdr=$(sed -n 's/.*GEIST_VERSION_STRING "\([0-9][0-9.]*\)".*/\1/p' include/geist.h | head -1)
          test "$hdr" = "$REQUESTED_VERSION" || {
            echo "::error::requested $REQUESTED_VERSION, but include/geist.h says $hdr"
            exit 1
          }
          tag="v$hdr"
          # the newest release tag must be part of this candidate's history
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          git merge-base --is-ancestor "$latest^{}" HEAD || {
            echo "::error::release $latest is not an ancestor of $sha"
            exit 1
          }
          if [ "$DRY_RUN" = true ]; then
            echo "rehearsal of $tag at $sha"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists; never move a release tag, bump the version"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$hdr" >> "$GITHUB_OUTPUT"
      - name: Release self-consistency
        run: sh scripts/check-release.sh

  linux-arm64:
    name: linux-arm64 (musl-static, dependency-free)
    needs: version-guard
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-guard.outputs.sha }}
      # Build fully static against **musl** (not glibc): the result has literally
      # no libc dependency, is more portable than a glibc -static binary (no NSS /
      # glibc-version quirks), and is much smaller. Alpine 3.21 ships gcc 14
      # (needed for -std=c23) and a musl-built libgomp for OpenMP. The host job
      # stays on ubuntu-arm so checkout / upload-artifact (Node actions) work;
      # only the compile runs in the container, writing into the mounted volume.
      # GEMM_PROVIDER=native -> native NEON fp32 + vendored FFT (no OpenBLAS/FFTW),
      # so the archive carries no BLAS dependency into a consumer's link. The
      # artifact is libgeist.a plus headers: link flags like -static belong to
      # whoever links it, not to building an archive, so this job passes none.
      - name: Build + smoke + package libgeist SDK
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers
            make TARGET=linux CC=gcc GEMM_PROVIDER=native lib
            mkdir -p dist/libgeist-linux-arm64/include
            cp lib/linux/release/libgeist.a dist/libgeist-linux-arm64/
            cp include/*.h dist/libgeist-linux-arm64/include/
            cp LICENSE dist/libgeist-linux-arm64/
            d=dist/libgeist-linux-arm64
            # --whole-archive: a static link only pulls referenced objects, so a
            # plain smoke link can pass while an object the smoke never reaches
            # still has unresolved deps (geistlib#144). Forcing every object in
            # makes the link itself assert the full archive resolves with the
            # documented consumer flags.
            cc -std=c23 -I "$d/include" examples/embed_smoke.c \
              -Wl,--whole-archive "$d/libgeist.a" -Wl,--no-whole-archive \
              -fopenmp -lm -o /tmp/sdk_smoke
            /tmp/sdk_smoke
            cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/agent_smoke
            /tmp/agent_smoke
            cc -std=c23 -I "$d/include" examples/runtime_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/runtime_smoke
            /tmp/runtime_smoke

            # ---- CLI binaries ------------------------------------------------
            # geist-linux-arm64: the slim bring-your-own-GGUF CLI (<1 MB).
            # Fully static (musl + libgomp.a): runs on any 64-bit Pi OS with
            # no toolchain, no Python, no shared libs.
            cc -std=c23 -static -I "$d/include" examples/simple_generate.c \
              "$d/libgeist.a" -fopenmp -lm -o dist/geist-linux-arm64
            # No model in this smoke: exit 2 + usage is the contract.
            ./dist/geist-linux-arm64 2>/dev/null || [ $? -eq 2 ]
          '
          tar -C dist -czf libgeist-linux-arm64.tar.gz libgeist-linux-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: libgeist-linux-arm64
          path: libgeist-linux-arm64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: geist-cli-linux-arm64
          path: dist/geist-linux-arm64
          compression-level: 0

  linux-x86_64:
    name: linux-x86_64 (musl-static, AVX-512, dependency-free)
    needs: version-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-guard.outputs.sha }}
      # Same musl-static recipe as arm64, on x86_64, with the native
      # AVX-512/VNNI backend (BACKENDS="cpu_x86 cpu_scalar"). Baseline is
      # x86-64-v3 with the AVX-512 kernels compiled per-TU and runtime-dispatched
      # via hw_probe, so the one binary runs on any x86-64-v3 CPU (no SIGILL).
      # GEMM_PROVIDER=native -> BLAS-free (portable scalar fp32 for the
      # vision/audio dense path; the quantized text kernels never touch BLAS).
      - name: Build + smoke + package libgeist SDK
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache build-base linux-headers
            make TARGET=linux CC=gcc BACKENDS="cpu_x86 cpu_scalar" GEMM_PROVIDER=native lib
            mkdir -p dist/libgeist-linux-x86_64/include
            cp lib/linux/release/libgeist.a dist/libgeist-linux-x86_64/
            cp include/*.h dist/libgeist-linux-x86_64/include/
            cp LICENSE dist/libgeist-linux-x86_64/
            d=dist/libgeist-linux-x86_64
            # --whole-archive: see the arm64 job (geistlib#144).
            cc -std=c23 -I "$d/include" examples/embed_smoke.c \
              -Wl,--whole-archive "$d/libgeist.a" -Wl,--no-whole-archive \
              -fopenmp -lm -o /tmp/sdk_smoke
            /tmp/sdk_smoke
            cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/agent_smoke
            /tmp/agent_smoke
            cc -std=c23 -I "$d/include" examples/runtime_contract_smoke.c "$d/libgeist.a" -fopenmp -lm -o /tmp/runtime_smoke
            /tmp/runtime_smoke

            # ---- CLI binaries — mirror of the arm64 job (geistlib#217) ------
            # geist-linux-x86_64: the slim bring-your-own-GGUF CLI. Fully
            # static (musl + libgomp.a); x86-64-v3 baseline with AVX-512
            # runtime-dispatched, so it runs on any Haswell/Zen+ machine.
            cc -std=c23 -static -I "$d/include" examples/simple_generate.c \
              "$d/libgeist.a" -fopenmp -lm -o dist/geist-linux-x86_64
            # No model in this smoke: exit 2 + usage is the contract.
            ./dist/geist-linux-x86_64 2>/dev/null || [ $? -eq 2 ]
          '
          tar -C dist -czf libgeist-linux-x86_64.tar.gz libgeist-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: libgeist-linux-x86_64
          path: libgeist-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: geist-cli-linux-x86_64
          path: dist/geist-linux-x86_64
          compression-level: 0

  macos-arm64:
    name: macos-arm64 (Accelerate/AMX)
    needs: version-guard
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-guard.outputs.sha }}
      - name: Install libomp
        run: brew install libomp
      # GEIST_STATIC_OMP=1 -> mk/target-mac-omp.mk links the static libomp.a
      # rather than -lomp, so geistlib's OWN binaries depend only on system
      # frameworks (Accelerate/libSystem, always present). It does not change
      # the packaged archive; see the note at the smoke link below.
      - name: Build + smoke + package libgeist SDK
        run: |
          make TARGET=mac-omp CC=clang GEIST_STATIC_OMP=1 lib
          mkdir -p dist/libgeist-macos-arm64/include
          cp lib/mac-omp/release/libgeist.a dist/libgeist-macos-arm64/
          cp include/*.h dist/libgeist-macos-arm64/include/
          cp LICENSE dist/libgeist-macos-arm64/
          d=dist/libgeist-macos-arm64
          # The archive holds geist's objects, not the OpenMP runtime: an .a is
          # not a link. GEIST_STATIC_OMP=1 governs how geistlib links its OWN
          # binaries, so a consumer of the packaged SDK still supplies libomp
          # and Accelerate itself — the same flags mk/target-mac-omp.mk uses.
          # Linking the smokes the way a real consumer must is the whole point
          # of a packaging gate (geistlib#144).
          omp=$(brew --prefix libomp)
          link="-framework Accelerate $omp/lib/libomp.a -lm"
          # -force_load = ld64's --whole-archive: every object must resolve
          # with the documented consumer flags, not just the ones the smoke
          # happens to reference (geistlib#144).
          cc -std=c23 -I "$d/include" examples/embed_smoke.c \
            -Wl,-force_load,"$d/libgeist.a" $link -o /tmp/sdk_smoke
          /tmp/sdk_smoke
          cc -std=c23 -I "$d/include" examples/agent_contract_smoke.c "$d/libgeist.a" $link -o /tmp/agent_smoke
          /tmp/agent_smoke
          cc -std=c23 -I "$d/include" examples/runtime_contract_smoke.c "$d/libgeist.a" $link -o /tmp/runtime_smoke
          /tmp/runtime_smoke
          tar -C dist -czf libgeist-macos-arm64.tar.gz libgeist-macos-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: libgeist-macos-arm64
          path: libgeist-macos-arm64.tar.gz
  release:
    name: verify, upload to geisten.net and publish
    needs: [version-guard, linux-arm64, linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version-guard.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Checksum the assets and verify the set
        run: |
          set -eu
          mkdir -p out
          find dist \( -name '*.tar.gz' -o -name 'geist-*' \) -type f -exec cp {} out/ \;
          chmod +x out/geist-*
          (cd out && sha256sum *.tar.gz geist-* | sort -k2 > SHA256SUMS)
          printf '%s\n' \
            SHA256SUMS \
            geist-linux-arm64 \
            geist-linux-x86_64 \
            libgeist-linux-arm64.tar.gz \
            libgeist-linux-x86_64.tar.gz \
            libgeist-macos-arm64.tar.gz | sort > /tmp/expected-assets
          ls out | sort | diff -u /tmp/expected-assets -
      - name: Draft on Gitea, upload to geisten.net, verify, publish
        env:
          GITEA_TOKEN: ${{ github.token }}
          GITEA_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_SHA: ${{ needs.version-guard.outputs.sha }}
          RELEASE_TAG: ${{ needs.version-guard.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version-guard.outputs.version }}
        run: |
          set -eu
          command -v rsync >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y rsync >/dev/null; }
          awk -v version="$RELEASE_VERSION" '
            $0 ~ "^## \\[" version "\\] — " { found=1; next }
            found && /^## \[[0-9]/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          echo "$RELEASE_VERSION" > out/VERSION
          printf '{"version": "%s", "tag": "%s"}\n' "$RELEASE_VERSION" "$RELEASE_TAG" > out/release.json  # README badge

          # 1. the Gitea release as a draft (no tag yet), with every file
          gitea() { curl -fsS -H "Authorization: token $GITEA_TOKEN" "$@"; }
          id_of() { python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'; }
          rid=$(gitea "$GITEA_API/releases/tags/$RELEASE_TAG" 2>/dev/null | id_of || true)
          [ -z "$rid" ] || [ "$DRY_RUN" = true ] || {
            draft=$(gitea "$GITEA_API/releases/$rid" | python3 -c 'import json,sys; print(json.load(sys.stdin)["draft"])')
            [ "$draft" = True ] || { echo "::error::$RELEASE_TAG is already published"; exit 1; }
          }
          if [ -z "$rid" ]; then
            rid=$(python3 -c 'import json,os; print(json.dumps({"tag_name": os.environ["RELEASE_TAG"], "target_commitish": os.environ["RELEASE_SHA"], "name": "geist " + os.environ["RELEASE_TAG"], "body": open("/tmp/release-notes.md").read(), "draft": True}))' \
              | gitea -X POST -H 'Content-Type: application/json' "$GITEA_API/releases" -d @- | id_of)
          fi
          names() { gitea "$GITEA_API/releases/$rid/assets" | python3 -c 'import json,sys; [print(a["name"]) for a in json.load(sys.stdin)]' | sort; }
          for f in $(cat /tmp/expected-assets); do
            names | grep -qx "$f" || gitea -X POST -F "attachment=@out/$f" "$GITEA_API/releases/$rid/assets?name=$f" >/dev/null
          done
          names | diff -u /tmp/expected-assets -

          # 2. geisten.net: the version directory (rehearsal/ in a dry run)
          dir=$RELEASE_TAG; [ "$DRY_RUN" = true ] && dir=rehearsal
          mkdir -p ~/.ssh && umask 077
          printf '%s\n' "$DOWNLOAD_SSH_KEY" > ~/.ssh/download_key
          echo "www.geisten.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO66CjOfnd/GIiCFyqhGxLudBXi/mCD0IA8DBbbZ2O2i" > ~/.ssh/known_hosts_download
          ssh_cmd="ssh -F /dev/null -i $HOME/.ssh/download_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_download"
          mkdir -p "stage/geistlib/$dir" && cp out/* "stage/geistlib/$dir/"
          # httpd lists no directories: a plain index per version
          { echo "<!doctype html><meta charset=utf-8><title>geistlib $RELEASE_TAG</title>"
            echo "<h1>geistlib $RELEASE_TAG</h1><p>Release notes: CHANGELOG.md in the source. Verify with <code>sha256sum -c SHA256SUMS</code>.</p><ul>"
            while read -r sum f; do echo "<li><a href=\"$f\">$f</a> <code>$sum</code></li>"; done < out/SHA256SUMS
            echo "<li><a href=\"SHA256SUMS\">SHA256SUMS</a></li></ul>"; } > "stage/geistlib/$dir/index.html"
          chmod 644 stage/geistlib/$dir/* && chmod 755 stage/geistlib/$dir/geist-*
          rsync -rlt --chmod=Du=rwx,Dgo=rx -e "$ssh_cmd" stage/ germar@www.geisten.net:
          base=https://geisten.net/download/geistlib/$dir
          verify() {
            mkdir -p /tmp/fetched && rm -f /tmp/fetched/*
            for f in $(cat /tmp/expected-assets) VERSION; do curl -fsS -o "/tmp/fetched/$f" "$1/$f"; done
            (cd /tmp/fetched && sha256sum -c SHA256SUMS) && cmp /tmp/fetched/SHA256SUMS out/SHA256SUMS \
              && test "$(cat /tmp/fetched/VERSION)" = "$RELEASE_VERSION"
          }
          verify "$base"

          if [ "$DRY_RUN" = true ]; then
            gitea -X DELETE "$GITEA_API/releases/$rid"
            gitea -X DELETE "$GITEA_API/tags/$RELEASE_TAG" 2>/dev/null || true
            echo "rehearsal OK: all files verified at $base; Gitea draft deleted, nothing published"
            exit 0
          fi

          # 3. publish: the Gitea release (creates the tag at RELEASE_SHA), then latest
          gitea -X PATCH -H 'Content-Type: application/json' "$GITEA_API/releases/$rid" -d '{"draft": false}' >/dev/null
          git fetch -q origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          rm -rf stage && mkdir -p stage/geistlib && ln -s "$RELEASE_TAG" stage/geistlib/latest
          rsync -rlt -e "$ssh_cmd" stage/ germar@www.geisten.net:
          verify https://geisten.net/download/geistlib/latest
          sh scripts/check-published-release.sh
