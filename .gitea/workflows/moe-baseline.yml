name: moe-baseline

# Phase 3 of the offload proposal (#78, docs/OFFLOAD.md): the bar for an MoE
# model that does not fit the card, on the geist-vulkan box (RTX 2080 Ti
# 11 GB, Ryzen 9 9950X). Measures prefill and decode of Qwen3-30B-A3B
# Q4_K_M (18.6 GB) for
#   geist cpu_x86, geist vulkan (weights spill to host memory, #466),
#   geist split (planner, GEIST_SPLIT_AUTO) + offload (today both Vulkan
#   configurations refuse the model at load: qwen3moe experts are CPU-only),
#   geist hot experts on the GPU (phase 3, moe_gpu.c): with the #48 profile
#   and without (the same share of every layer), the model on the CPU,
#   geist-gpu: the model on Vulkan, its experts on a CPU backend of its own
#   and the hottest of them copied to the GPU,
#   llama.cpp CPU, llama.cpp Vulkan with -ot exps=CPU (experts on the CPU,
#   the rest on the GPU: the usual recipe phase 3 has to beat).
# Each configuration is capped by a timeout; a timeout is a result.
#
# On demand only:  tea actions workflows dispatch --login git.geisten.net \
#   --repo geisten/geistlib --ref <branch> -i ref=<branch> moe-baseline.yml

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "geistlib ref"
        type: string
        default: main
      model_url:
        description: "MoE GGUF (cached by file name)"
        type: string
        default: https://huggingface.co/Qwen/Qwen3-30B-A3B-GGUF/resolve/e4d4bafdfb96a411a163846265362aceb0b9c63a/Qwen3-30B-A3B-Q4_K_M.gguf
      model_sha256:
        description: "sha256 of the GGUF"
        type: string
        default: 0d003f6662faee786ed5da3e31b29c978de5ae5d275c8794c606a7f3c01aa8f5
      configs:
        description: "configurations, separated by ;"
        type: string
        default: "geist-cpu;geist-hot;geist-hot-uniform;llama-cpu;llama-exps-cpu"
      cycles:
        description: "interleaved cycles"
        type: string
        default: "2"
      env:
        description: "extra environment for the geist configurations, separated by ;"
        type: string
        default: ""
      sweep:
        description: "bench_perf_sweep arguments besides --gguf"
        type: string
        default: "--seq-lens 512 --decode-n 32 --warmup 8 --repeats 3 --m-max 128"
      nll:
        description: "bench_nll configurations, separated by ; (cpu, hot, gpu; scalar = cpu_scalar, the reference)"
        type: string
        default: "cpu;hot;gpu"
      nll_first:
        description: "bench_nll: score the predictions from this position on (512 = llama-perplexity -c 1024's tokens)"
        type: string
        default: "0"
      llama_ppl:
        description: "llama-perplexity -c 1024 on the same text, the independent reference: its --n-cpu-moe (empty: skip)"
        type: string
        default: ""
      build:
        description: "extra make variables for geistlib, e.g. OPENMP=0 (its own spinning thread pool)"
        type: string
        default: ""
      llama_real:
        description: "llama.cpp on real text: --n-cpu-moe values for llama-server, separated by ; (empty: skip)"
        type: string
        default: ""
      hog:
        description: "busy loops started beside each configuration, after the quiet-host gate (a host shared with CI, #161); 0: none"
        type: string
        default: "0"
      cap:
        description: "timeout per configuration and cycle, seconds"
        type: string
        default: "1200"
      runtime_profile:
        description: "#165: the run-time profile of one session (one #48 profile file; half of two) and of every profile file, held-out cover against the profile input's; 'yes' or empty"
        type: string
        default: ""
      quiet:
        description: "1: the measuring steps also hold the desktop's bench lock (pauses its docker CI)"
        type: string
        default: ""
      make_profile:
        description: "measure this model's expert profile first (geist's router trace on the #48 corpus) and use it: '<n_experts> <experts per token>', e.g. '256 8'; empty: skip"
        type: string
        default: ""
      profile:
        description: "expert usage profile (GEIST_MOE_PROFILE) of this model; empty: none"
        type: string
        default: benchmark/results/raw/2026-10-15_moe_expert_usage_vulkan_run1225.txt # #48, Qwen3-30B-A3B

permissions:
  contents: read

jobs:
  baseline:
    name: MoE baseline on geist-vulkan
    runs-on: geist-vulkan
    timeout-minutes: 300
    env:
      MODEL_URL: ${{ inputs.model_url }}
      MODEL_SHA: ${{ inputs.model_sha256 }}
      CONFIGS: ${{ inputs.configs }}
      CYCLES: ${{ inputs.cycles }}
      CAP: ${{ inputs.cap }}
      XENV: ${{ inputs.env }}
      SWEEP_ARGS: ${{ inputs.sweep }}
      GGML_VK_VISIBLE_DEVICES: "0" # the discrete card, not the Raphael iGPU
      # No run-time profile from earlier runs (#165): each configuration's
      # placement is the one its inputs name.
      GEIST_MOE_PROFILE_CACHE: "0"
      PROFILE: ${{ inputs.profile }}
      GEIST_QUIET: ${{ inputs.quiet }}
      HOG: ${{ inputs.hog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Environment
        run: |
          mkdir -p out
          { git rev-parse HEAD; nvidia-smi; free -g; nproc; } 2>&1 | tee out/env.txt
      - name: Build geistlib (vulkan + cpu_x86)
        run: |
          make TARGET=linux BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native ${{ inputs.build }} bin
          # OPENMP=0 builds into bin/linux/release-noomp
          echo "GBIN=$(dirname "$(find bin -path '*/release*/tests/bench_perf_sweep' | head -1)")" >> "$GITHUB_ENV"
      - name: llama.cpp (pinned, cpu and vulkan)
        run: |
          set -eo pipefail
          echo "LLAMA_CPU=$(scripts/ensure-llama-bench.sh cpu)" >> "$GITHUB_ENV"
          echo "LLAMA_VK=$(scripts/ensure-llama-bench.sh vulkan)" >> "$GITHUB_ENV"
      - name: Model (cached outside the workspace, sha256-checked)
        run: |
          set -eo pipefail
          F=$(python3 tools/fetch_bench_model.py --url "$MODEL_URL" --sha256 "$MODEL_SHA")
          echo "MODEL=$F" >> "$GITHUB_ENV"
      - name: Expert usage profile of this model (router trace on the #48 corpus)
        if: inputs.make_profile != ''
        env:
          SHAPE: ${{ inputs.make_profile }}
        run: |
          set -eo pipefail
          # The #48 corpus: Gutenberg prose and code, a profile set and a
          # held-out set; the measurement text (docs/OFFLOAD.md) is in neither.
          L=$(dirname "$(dirname "$(dirname "$LLAMA_CPU")")")
          python3 tools/moe_usage/corpus.py out/corpus . "$L"
          DUMP=$(find bin -path '*/release*' -name dump_geist_logits | head -1)
          N=$(basename "$MODEL" .gguf)
          for s in profile heldout; do
            mkdir -p out/trace/$s
            for f in out/corpus/$s/*.txt; do
              GEIST_MOE_TRACE=out/trace/$s/$(basename "$f" .txt).trace GEIST_DUMP_BACKEND=cpu_x86 \
                "$DUMP" "$MODEL" "$f" /dev/null /dev/null 2>> out/log.txt
            done
            python3 tools/moe_usage/trace_usage.py "$N" $s $SHAPE out/trace/$s/*.trace >> out/usage.txt
          done
          python3 tools/moe_usage/analyze.py out/usage.txt | tee out/usage-analysis.txt
          rm -rf out/trace # ~160 MB; usage.txt holds the counts
          # A variable of its own: the job's PROFILE (the input) stays as it is.
          echo "PROFILE_MADE=$PWD/out/usage.txt" >> "$GITHUB_ENV"
      - name: Run-time profile against the hand-made one (#165)
        if: inputs.runtime_profile != ''
        run: |
          set -eo pipefail
          L=$(dirname "$(dirname "$(dirname "$LLAMA_CPU")")")
          python3 tools/moe_usage/corpus.py out/corpus . "$L"
          DUMP=$(find bin -path '*/release*' -name dump_geist_logits | head -1)
          sess() { # sess <cache dir> <file>: one session over the file, counted into the cache
            GEIST_MOE_PROFILE_CACHE="$1" GEIST_DUMP_BACKEND=cpu_x86 "$DUMP" "$MODEL" "$2" /dev/null /dev/null 2>> out/log.txt
          }
          # lines <cache dir> <set> <file>: its USAGE lines as model "m", that set and file
          lines() { sed -n "s/^USAGE [0-9a-f]* profile run-time /USAGE m $2 $3 /p" "$1"/*.txt; }
          P=out/corpus/profile H=out/corpus/heldout
          held=out/held.txt; : > $held
          for f in $H/*.txt; do # one cache each: analyze.py reads the domain from the file name
            b=$(basename "$f"); sess out/pc-held/$b "$f"; lines out/pc-held/$b heldout $b >> $held
          done
          sess out/pc-one $P/en0.txt
          # two domains in one session, inside dump_geist_logits' 4,096-token context
          { head -c 7000 $P/c0.txt; head -c 7000 $P/de0.txt; } > out/two.txt && sess out/pc-two out/two.txt
          for f in $P/*.txt; do sess out/pc-all "$f"; done
          for v in one two all; do
            { lines out/pc-$v profile run0.txt; cat $held; } > out/rt-$v.txt
            echo "== run-time profile: $v ($(sed -n 's/^USAGE [0-9a-f]* profile run-time \([0-9]*\) 0 .*/\1/p' out/pc-$v/*.txt) tokens)"
            python3 tools/moe_usage/analyze.py out/rt-$v.txt | grep -E '^\| [0-9]'
          done | tee out/runtime-profile.txt
          if [ -n "$PROFILE" ]; then
            { sed -n 's/^USAGE [^ ]* profile \([^ ]*\) /USAGE m profile \1 /p' "$PROFILE"; cat $held; } > out/rt-hand.txt
            { echo "== the hand-made profile ($PROFILE)"; python3 tools/moe_usage/analyze.py out/rt-hand.txt | grep -E '^\| [0-9]'; } | tee -a out/runtime-profile.txt
          fi
      - name: Hot experts against the CPU (logits, greedy tokens; reported)
        continue-on-error: true
        run: |
          set -o pipefail
          . scripts/gpu-lock.sh
          GEIST_SPLIT_BACKEND=vulkan GEIST_SPLIT_GGUF_PATH="$MODEL" GEIST_SPLIT_POINTS=1 \
            GEIST_MOE_PROFILE="${PROFILE_MADE:-$PROFILE}" GEIST_VERBOSE=1 \
            "$GBIN"/test_layer_split_int 2>&1 \
            | grep -v '^geist vulkan: device memory' | tee out/hot-vs-cpu.txt
      - name: Quality, perplexity of docs/OFFLOAD.md (CPU vs hot experts)
        continue-on-error: true
        env:
          XENV: ${{ inputs.env }}
          NLLCFG: ${{ inputs.nll }}
          NLLFIRST: ${{ inputs.nll_first }}
        run: |
          set -o pipefail
          . scripts/gpu-lock.sh
          NLL="$GBIN"/bench_nll
          XNLL=$(echo "$XENV" | tr ';' ' ')
          for cfg in $(echo "$NLLCFG" | tr ';' ' '); do
            B=cpu_x86
            case $cfg in
              scalar) X=; B=cpu_scalar ;;
              hot) X="GEIST_MOE_PROFILE=${PROFILE_MADE:-$PROFILE} GEIST_BENCH_SPLIT_BACKEND=vulkan GEIST_BENCH_SPLIT_LAYERS=auto" ;;
              gpu) X="GEIST_MOE_PROFILE=${PROFILE_MADE:-$PROFILE}"; B=vulkan ;;
              *) X= ;;
            esac
            ( while :; do nvidia-smi --query-gpu=pstate,clocks.sm,clocks.mem,utilization.gpu --format=csv,noheader \
                | sed "s/^/nll-$cfg 1, /"; sleep 0.5; done >> out/clocks.txt ) &
            clk=$!
            echo "== nll $cfg" >> out/log.txt
            env $X $XNLL GEIST_VERBOSE=1 GEIST_BENCH_BACKEND=$B "$NLL" "$MODEL" docs/OFFLOAD.md 1024 "$NLLFIRST" 2>> out/log.txt \
              | sed "s/^{/{\"cfg\":\"$cfg\",/" | tee -a out/nll.jsonl
            kill $clk 2>/dev/null || true
          done
      - name: llama.cpp perplexity on the same text (the independent reference)
        if: inputs.llama_ppl != ''
        continue-on-error: true
        env:
          NCMOE: ${{ inputs.llama_ppl }}
        run: |
          set -eo pipefail
          . scripts/gpu-lock.sh
          BUILD=$(dirname "$(dirname "$LLAMA_VK")")
          cmake --build "$BUILD" --target llama-perplexity -j "$(nproc)" > /dev/null
          # One window of 1024 tokens; llama-perplexity scores its second
          # half: bench_nll with nll_first = 512 scores the same tokens.
          "$BUILD/bin/llama-perplexity" -m "$MODEL" -f docs/OFFLOAD.md -c 1024 -b 1024 --chunks 1 \
            --device Vulkan0 -ngl 99 --n-cpu-moe "$NCMOE" 2>&1 | tee out/llama-perplexity.txt
          P=$(sed -n 's/.*Final estimate: PPL = \([0-9.]*\).*/\1/p' out/llama-perplexity.txt)
          echo "{\"cfg\":\"llama-perplexity\",\"ppl\":$P}" | tee -a out/nll.jsonl
      - name: llama.cpp on real text (llama-server, --n-cpu-moe sweep)
        if: inputs.llama_real != ''
        continue-on-error: true
        env:
          NCMOE: ${{ inputs.llama_real }}
        run: |
          set -eo pipefail
          . scripts/gpu-lock.sh
          BUILD=$(dirname "$(dirname "$LLAMA_VK")")
          cmake --build "$BUILD" --target llama-server -j "$(nproc)" > /dev/null
          SERVER="$BUILD/bin/llama-server"
          # The comparison is Vulkan against Vulkan, on the discrete card:
          # list what llama.cpp sees and name the device explicitly.
          "$SERVER" --list-devices 2>&1 | tee out/llama-devices.txt
          grep -q "Vulkan0" out/llama-devices.txt || { echo "llama.cpp sees no Vulkan0"; exit 1; }
          for k in $(echo "$NCMOE" | tr ';' ' '); do
            echo "== llama-real ncmoe=$k" | tee -a out/log.txt
            ( while :; do nvidia-smi --query-gpu=pstate,clocks.sm,clocks.mem,utilization.gpu --format=csv,noheader \
                | sed "s/^/llama-real-$k 1, /"; sleep 0.5; done >> out/clocks.txt ) &
            clk=$!
            "$SERVER" -m "$MODEL" --device Vulkan0 -ngl 99 --n-cpu-moe "$k" -c 4096 -np 1 --port 8099 >> out/llama-server.log 2>&1 &
            pid=$!
            python3 - "$k" "$CYCLES" "$pid" <<'PY' | tee -a out/results.jsonl || true
          import json, sys, time, urllib.request
          import os
          k, cycles, pid = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          base = "http://127.0.0.1:8099"
          def post(path, body):
              r = urllib.request.Request(base + path, data=json.dumps(body).encode(),
                                         headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(r, timeout=600))
          for _ in range(600):  # model load; a server that died (no room on the card) ends it
              try:
                  os.kill(pid, 0)
              except OSError:
                  print(json.dumps({"cfg": "llama-real-" + k, "error": "server exited"}))
                  sys.exit(0)
              try:
                  if json.load(urllib.request.urlopen(base + "/health", timeout=5)).get("status") == "ok":
                      break
              except Exception:
                  pass
              time.sleep(1)
          # the same prompt tokens bench_perf_sweep --prompt-file uses: the file's first 512
          ids = post("/tokenize", {"content": open("docs/OFFLOAD.md").read()})["tokens"][:512]
          for c in range(cycles + 1):  # the first is warmup
              t = post("/completion", {"prompt": ids, "n_predict": 128, "temperature": 0,
                                       "cache_prompt": False, "ignore_eos": True})["timings"]
              if c > 0:
                  print(json.dumps({"cfg": "llama-real-" + k, "cycle": c,
                                    "prefill_tps": t["prompt_per_second"],
                                    "decode_tps": t["predicted_per_second"]}))
          PY
            kill $pid 2>/dev/null || true
            wait $pid 2>/dev/null || true
            kill $clk 2>/dev/null || true
          done
      - name: Measure, interleaved
        run: |
          set -o pipefail
          . scripts/gpu-lock.sh
          GB="$GBIN"/bench_perf_sweep
          SWEEP="--gguf $MODEL $SWEEP_ARGS"
          X=$(echo "$XENV" | tr ';' ' ')
          LB="-m $MODEL -p 512 -n 32 -r 3 -o jsonl"
          for c in $(seq "$CYCLES"); do
            for cfg in $(echo "$CONFIGS" | tr ';' ' '); do
              # quiet host: the desktop's docker CI runners share these cores
              half=$(( $(nproc) / 2 ))
              for i in $(seq 60); do
                awk -v h="$half" '{exit !($1 < h)}' /proc/loadavg && break; sleep 10
              done
              echo "== cycle $c $cfg (load $(cut -d' ' -f1 /proc/loadavg))" | tee -a out/log.txt
              case $cfg in
                geist-cpu)    cmd="env $X GEIST_VERBOSE=1 GEIST_BENCH_BACKEND=cpu_x86 $GB $SWEEP" ;;
                geist-vulkan) cmd="env GEIST_BENCH_BACKEND=vulkan GEIST_VK_VERBOSE=1 $GB $SWEEP" ;;
                geist-gpu)    cmd="env $X GEIST_VERBOSE=1 GEIST_MOE_PROFILE=${PROFILE_MADE:-$PROFILE} GEIST_BENCH_BACKEND=vulkan $GB $SWEEP" ;;
                geist-split|geist-hot-uniform)
                              cmd="env $X GEIST_VERBOSE=1 GEIST_BENCH_BACKEND=cpu_x86 GEIST_BENCH_SPLIT_BACKEND=vulkan GEIST_BENCH_SPLIT_LAYERS=auto $GB $SWEEP" ;;
                geist-hot)    cmd="env $X GEIST_VERBOSE=1 GEIST_MOE_PROFILE=${PROFILE_MADE:-$PROFILE} GEIST_BENCH_BACKEND=cpu_x86 GEIST_BENCH_SPLIT_BACKEND=vulkan GEIST_BENCH_SPLIT_LAYERS=auto $GB $SWEEP" ;;
                llama-cpu)    cmd="$LLAMA_CPU $LB" ;;
                llama-exps-cpu) cmd="$LLAMA_VK $LB -ngl 99 -ot exps=CPU" ;;
                *) echo "unknown $cfg"; continue ;;
              esac
              hogs=""
              for i in $(seq "$HOG"); do sh -c 'while :; do :; done' & hogs="$hogs $!"; done
              s=$(date +%s)
              # GPU clocks and power state while the configuration runs
              ( while :; do nvidia-smi --query-gpu=pstate,clocks.sm,clocks.mem,utilization.gpu --format=csv,noheader \
                  | sed "s/^/$cfg $c, /"; sleep 0.5; done >> out/clocks.txt ) &
              clk=$!
              rc=0 # the runner's shell is bash -e: a failed configuration must not end the loop
              timeout "$CAP" $cmd 2>> out/log.txt \
                | sed "s/^{/{\"cfg\":\"$cfg\",\"cycle\":$c,/" | tee -a out/results.jsonl || rc=$?
              kill $clk 2>/dev/null || true
              [ -n "$hogs" ] && kill $hogs 2>/dev/null || true
              echo "== $cfg cycle $c: exit $rc after $(( $(date +%s) - s )) s (hogs: $HOG)" | tee -a out/log.txt
            done
          done
          true
      - name: Job summary
        if: always()
        run: |
          { echo '```'; grep '^== ' out/log.txt; grep -E 'planner|spill|offload|moe:' out/log.txt | sort | uniq -c | head -20;
            grep -E 'kv .*(split|gpu)|FAIL' out/hot-vs-cpu.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 30
          name: moe-baseline
          path: out/
          if-no-files-found: warn
