name: offload-route

# Phase 1 of the offload proposal (#78, docs/OFFLOAD.md) on the geist-vulkan
# box (RTX 2080 Ti 11 GB, Ryzen 9 9950X). A split model (#49) whose
# load-backend layers route their linears to Vulkan twins from
# GEIST_OFFLOAD_M_MIN rows on:
#   1. test_layer_split_int on two cpu_x86 instances: the route must be
#      byte-identical (the twins run the same kernels);
#   2. the same test with Vulkan as the split backend on Qwen3-14B Q8_0,
#      reported;
#   3. bench_perf_sweep: split alone against split + route, interleaved.
#
# On demand only:  tea actions workflows dispatch --login git.geisten.net \
#   --repo geisten/geistlib --ref <branch> -i ref=<branch> offload-route.yml

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "geistlib ref"
        type: string
        default: main
      model_url:
        description: "GGUF that does not fit the card (cached by file name)"
        type: string
        default: https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/530227a7d994db8eca5ab5ced2fb692b614357fd/Qwen3-14B-Q8_0.gguf
      model_sha256:
        description: "sha256 of the GGUF"
        type: string
        default: a0dfe649137410b7d82f06a209240508e218f32f5b6fd81b69d6932160cfcd9d
      split:
        description: "layers on the GPU, separated by ; (auto: the planner, GEIST_SPLIT_AUTO)"
        type: string
        default: "26"
      m_min:
        description: "GEIST_OFFLOAD_M_MIN for the offload rows (auto: leave it unset, the default)"
        type: string
        default: "auto"
      m_max:
        description: "prefill chunk sizes, separated by ;"
        type: string
        default: "64;128"
      cycles:
        description: "interleaved cycles"
        type: string
        default: "3"

permissions:
  contents: read

jobs:
  route:
    name: Offload route on geist-vulkan
    runs-on: geist-vulkan
    timeout-minutes: 180
    env:
      MODEL_URL: ${{ inputs.model_url }}
      MODEL_SHA: ${{ inputs.model_sha256 }}
      SPLIT: ${{ inputs.split }}
      M_MIN: ${{ inputs.m_min }}
      M_MAX: ${{ inputs.m_max }}
      CYCLES: ${{ inputs.cycles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Environment
        run: |
          mkdir -p route-out
          { git rev-parse HEAD; nvidia-smi; free -g; nproc; } 2>&1 | tee route-out/env.txt
      - name: Build geistlib (vulkan + cpu_x86)
        run: make TARGET=linux BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native bin
      - name: Byte-identical route on two cpu_x86 instances (SmolLM2-360M)
        run: |
          set -eo pipefail
          make fetch-llama-model
          GEIST_VERBOSE=1 bin/linux/release/tests/test_layer_split_int 2>&1 | tee route-out/exact.txt
      - name: Model (cached outside the workspace, sha256-checked)
        run: |
          set -eo pipefail
          CACHE=${GEIST_MODEL_CACHE:-$HOME/geist-models}
          mkdir -p "$CACHE"
          F="$CACHE/$(basename "$MODEL_URL")"
          if [ ! -f "$F" ]; then
            curl -fL --retry 5 -C - -o "$F.part" "$MODEL_URL"
            echo "$MODEL_SHA  $F.part" | sha256sum -c -
            mv "$F.part" "$F"
          fi
          echo "MODEL=$F" >> "$GITHUB_ENV"
      - name: Route with Vulkan twins (reported)
        continue-on-error: true
        run: |
          set -eo pipefail
          . scripts/gpu-lock.sh
          GEIST_SPLIT_BACKEND=vulkan GEIST_SPLIT_GGUF_PATH="$MODEL" GEIST_SPLIT_POINTS="$(echo "$SPLIT" | tr ';' '\n' | grep -m1 '^[0-9]')" \
            env $([ "$M_MIN" = auto ] || echo "GEIST_OFFLOAD_M_MIN=$M_MIN") GEIST_VERBOSE=1 GEIST_VK_VERBOSE=1 \
            bin/linux/release/tests/test_layer_split_int 2>&1 | grep -v '^geist vulkan: device memory' | tee route-out/vulkan.txt
      - name: Split against split + route
        run: |
          set -eo pipefail
          . scripts/gpu-lock.sh
          for c in $(seq "$CYCLES"); do
            for sp in $(echo "$SPLIT" | tr ';' ' '); do
            for m in $(echo "$M_MAX" | tr ';' ' '); do
              for cfg in split offload; do
                mm=$([ "$cfg" = offload ] && echo "$M_MIN" || echo 0)
                [ "$mm" = auto ] && mm=
                # the split alone runs every chunk on cpu_x86 too: at most 128 rows
                [ "$cfg" = split ] && [ "$m" -gt 128 ] && continue
                echo "== cycle $c $cfg split=$sp m_max=$m" >> route-out/bench.txt
                env ${mm:+GEIST_OFFLOAD_M_MIN=$mm} GEIST_VERBOSE=1 GEIST_BENCH_BACKEND=cpu_x86 \
                  GEIST_BENCH_SPLIT_BACKEND=vulkan GEIST_BENCH_SPLIT_LAYERS="$sp" \
                  bin/linux/release/tests/bench_perf_sweep --gguf "$MODEL" \
                  --seq-lens 512 --decode-n 32 --warmup 8 --repeats 3 --m-max "$m" \
                  2>> route-out/bench.txt \
                  | sed "s/^{/{\"cfg\":\"$cfg\",\"split\":\"$sp\",\"m_max\":$m,\"cycle\":$c,/" | tee -a route-out/bench.jsonl \
                  || echo "== FAILED: cycle $c $cfg split=$sp m_max=$m" | tee -a route-out/bench.txt
              done
            done
            done
          done
          grep -E '^== |offload|planner' route-out/bench.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```'; grep -E 'PASS|FAIL|byte-identical|offload|split' route-out/exact.txt route-out/vulkan.txt 2>/dev/null | head -80; echo '```';
            echo '```'; grep -o '"cfg":"[a-z]*","m_max":[0-9]*,"cycle":[0-9]*\|"prefill_tps":[0-9.]*\|"decode_tps":[0-9.]*' route-out/bench.jsonl 2>/dev/null | paste - - - ; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 30
          name: offload-route
          path: route-out/
          if-no-files-found: warn
