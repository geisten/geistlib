# A/B of two revisions on the real Pi 5 board, for a PR that has to show
# "no prefill/decode regression on Pi 5" (#698). tools/bench_revision_ab.py
# builds each revision in its own worktree and measures them interleaved,
# with a control run of the base binary. Both sides run on the same board
# in the same thermal state, so no stored baseline is involved; unlike
# pi5.yml this never touches ~/bench-geistlib/last-green.json.
#
#   tea actions workflows dispatch --login git.geisten.net --repo geisten/geistlib --ref main -i new=origin/<branch> pi5-ab.yml
name: pi5-ab

on:
  workflow_dispatch:
    inputs:
      new:
        description: "revision under test, e.g. origin/fix/698-neon-act-scales"
        required: true
      base:
        description: "baseline revision"
        default: origin/main
      # The board has 4 GB: the 3.1 GB Gemma 4 reference does not fit next to
      # two builds. The synthetic Llama-3.2-1B (Q4_K body, Q6_K embedding) is
      # written in seconds, no download. Any other make target that produces a
      # GGUF works too, e.g. gguf_artifacts/synth/smollm2-360m-q8_0.gguf.
      model:
        description: "make target of the GGUF to bench (its path)"
        default: gguf_artifacts/synth/llama32-1b-q4_k.gguf
      seq_lens:
        description: "prompt lengths (bench_perf_sweep --seq-lens)"
        default: "128,512"
      cycles:
        description: "interleaved cycles (at least 6)"
        default: "8"

permissions:
  contents: read

concurrency:
  group: pi5
  cancel-in-progress: false

jobs:
  ab:
    runs-on: pi5
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both revisions must resolve locally
      - name: model
        env:
          MODEL: ${{ inputs.model }}
        run: make "$MODEL"
      - name: board must be cool and idle before measuring
        run: |
          for i in $(seq 1 30); do
            t=$(cat /sys/class/thermal/thermal_zone0/temp); l=$(cut -d' ' -f1 /proc/loadavg)
            echo "temp=$t load=$l"
            [ "$t" -lt 60000 ] && [ "${l%.*}" -lt 1 ] && exit 0
            sleep 10
          done
          echo "board not cool/idle after 5 min; skipping the measurement" && exit 1
      - name: A/B (build + measure under the board lock)
        env:
          BASE: ${{ inputs.base }}
          NEW: ${{ inputs.new }}
          GGUF: ${{ inputs.model }}
          SEQ_LENS: ${{ inputs.seq_lens }}
          CYCLES: ${{ inputs.cycles }}
        run: |
          OMP_NUM_THREADS=4 ~/bin/with-pi-lock python3 tools/bench_revision_ab.py \
            --rev "base=$BASE" --rev "new=$NEW" --gguf "$GGUF" \
            --make-arg TARGET=pi5 --jobs 4 --seq-lens "$SEQ_LENS" --cycles "$CYCLES" \
            --out-dir "$RUNNER_TEMP/ab"
          cat "$RUNNER_TEMP"/ab/*/revision_ab.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          retention-days: 14
          name: pi5-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/ab/
          if-no-files-found: ignore
      - name: thermal state after the run
        if: always()
        run: echo "temp=$(cat /sys/class/thermal/thermal_zone0/temp) throttled=$(vcgencmd get_throttled 2>/dev/null || echo n/a)"
