name: exp105-spec-vulkan

# Experiment for geistlib#105 (not for merge): speculative decode against plain decode
# for Bonsai 2 27B on the RTX 2080 Ti (Vulkan), on 12 JevBench thinking prompts.
# tools/exp105/spec_accept.c drives geist_session_decode_speculative (n-gram drafter)
# and geist_session_decode_step (SEQ=1); results go to the job log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    runs-on: geist-vulkan
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a software device
        run: |
          vulkaninfo --summary 2>&1 | tee vulkan-env.txt
          grep -q PHYSICAL_DEVICE_TYPE_DISCRETE_GPU vulkan-env.txt
      - name: Build libgeist (vulkan) and the driver
        run: |
          make TARGET=linux BACKENDS="vulkan cpu_x86 cpu_scalar" GEMM_PROVIDER=native lib
          cc -std=c2x -O2 -Iinclude tools/exp105/spec_accept.c lib/linux/release/libgeist.a \
             -fopenmp -lm -ldl -lpthread -o spec_accept
      - name: Fetch Bonsai 2 27B (host cache, SHA-gated)
        env:
          GEIST_MODEL_CACHE: ${{ vars.GEIST_MODEL_CACHE }}
        run: |
          MODEL=$(python3 tools/fetch_bench_model.py --model bonsai2-27b-pq2 --protocol benchmark/cross_engine_gpu_protocol.json)
          echo "MODEL_PATH=$MODEL" >> "$GITHUB_ENV"
      - name: Plain decode vs speculative (n-gram), k=4, 192 tokens
        run: |
          set -eo pipefail
          . scripts/gpu-lock.sh
          SEQ=1 ./spec_accept "$MODEL_PATH" tools/exp105/prompts.txt vulkan 192 4
          ./spec_accept "$MODEL_PATH" tools/exp105/prompts.txt vulkan 192 4
          nvidia-smi --query-gpu=name,driver_version,memory.used,memory.total --format=csv,noheader || true
