name: agent

# The agent pipeline (AGENT.md §9): issue -> PR -> review by a stronger model
# -> automatic merge, driven by status labels.
#
#   issue `agent`        work: Claude Code implements the issue on
#                        agent/issue-<n>, opens the PR at once ("Closes #<n>",
#                        unclear points under "Assumptions") and labels it
#                        status:validate. A PR made by hand, or by a local
#                        Codex / Claude Code session, enters here instead.
#   PR status:validate   review: Opus, read-only, sees the issue and the
#                        diff only. PASS -> status:accepted and auto-merge
#                        once the required CI is green. FAIL -> the findings
#                        on the PR, a note on the issue, status:fix. A real
#                        CI failure after the PASS: ci-bot cancels the merge,
#                        posts the log tails, status:fix (scripts/ci-bot.py).
#   PR status:fix        fix: Claude Code works the newest review or CI
#                        failure on the PR's branch, pushes, -> status:validate.
#                        A 4th round, or a fix that changes nothing:
#                        status:stuck, for a human. A PR comment
#                        `/agent <text>` runs a fix with that text as feedback.
#   push to a PR in status:accepted cancels its auto-merge -> status:validate,
#                        so nothing unreviewed is merged.
#
# Nothing timed runs here: no benchmarks, no real models, no ssh to the Mac
# or the Pi (their locks). Issue, comment and PR texts reach the agents
# through files, never through ${{ }} in a script. Only germar starts work
# and `/agent` (they spend the subscription); status labels need write
# access, which can merge anyway.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (the Claude
# subscription; runs count against its usage limits, no API billing);
# AGENT_BOT_TOKEN = the geist-agent bot user (write, no admin). No Claude
# step sees the bot token; checkout keeps no credentials.
on:
  # ponytail: Gitea reports a label change as "labeled" with no reliable
  # `label` field, so jobs test the PR's/issue's labels; adding an unrelated
  # label (ci:full) to a PR in validate or fix re-runs that step once.
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}

jobs:
  work:
    if: >-
      github.event_name == 'issues' && github.event.sender.login == 'germar' &&
      contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      N: ${{ github.event.issue.number }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 jq
      # clang-format: the version the tree is formatted with (ci.yml's job).
      - name: Install clang-format 22 and Claude Code
        run: |
          sudo python3 -m pip install --break-system-packages clang-format==22.1.5
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work the issue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The container is the sandbox: no token, no ssh keys, thrown away.
          IS_SANDBOX: "1"
        run: |
          git config user.name "geist-agent"
          git config user.email "agent@geisten.net"
          git switch -c "$BRANCH"
          jq -r '"# #\(.issue.number): \(.issue.title)\n\n\(.issue.body // "")"' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue.md"
          claude -p --dangerously-skip-permissions --max-turns 200 <<EOF
          Work the Gitea issue in $RUNNER_TEMP/issue.md in this repository
          (geistlib). Read AGENT.md, CONTRIBUTING.md and the files the issue
          touches before changing anything.

          - Where the issue is unclear, take the most obvious reading and
            go on; do not stop to ask.
          - Implement it in small commits on the current branch. Each commit
            message says why and ends with
            "Co-Authored-By: Claude <noreply@anthropic.com>".
            A user-visible change gets a changes/<slug>.md fragment.
          - Before you finish, all of these must pass:
              make format-check
              make test-unit MODE=release TARGET=linux CC=gcc-14 AUTO_FETCH_MODEL=0
            If one cannot pass, say why in the PR description.
          - Do not push, do not run benchmarks or real models, do not ssh
            anywhere, do not edit CHANGELOG.md or .gitea/workflows/.
          - Finally write the PR description to $RUNNER_TEMP/pr.md following
            .github/pull_request_template.md, with "Closes #$N" on its own
            line and a section "## Assumptions" listing every reading you
            chose where the issue left a choice (or "none").
            Kernel, GPU or memory changes: say that the PR needs the label
            ci:full.
          EOF

      - name: Push, open the PR, -> status:validate
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
        run: |
          if [ -z "$(git rev-list origin/main..HEAD)" ]; then
            echo "::error::the agent made no commit"; exit 1
          fi
          # ponytail: force is safe only because agent/* branches are the agent's alone
          git push --force "${GITHUB_SERVER_URL%%://*}://x-access-token:$TOKEN@${GITHUB_SERVER_URL#*://}/$GITHUB_REPOSITORY.git" \
            "HEAD:refs/heads/$BRANCH"
          [ -s "$RUNNER_TEMP/pr.md" ] || printf 'Closes #%s\n' "$N" > "$RUNNER_TEMP/pr.md"
          jq -n --rawfile b "$RUNNER_TEMP/pr.md" --arg h "$BRANCH" \
              --arg t "$(jq -r '"agent: " + .issue.title' "$GITHUB_EVENT_PATH")" \
              '{head: $h, base: "main", title: $t, body: $b}' |
            curl -sS -o "$RUNNER_TEMP/new.json" -w '%{http_code}' -X POST "$API/pulls" \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @- > "$RUNNER_TEMP/code"
          case $(cat "$RUNNER_TEMP/code") in
            201) pr=$(jq .number "$RUNNER_TEMP/new.json") ;;
            # The PR of an earlier run exists; the push above updated it.
            409) pr=$(curl -sSf -H "Authorization: token $TOKEN" "$API/pulls?state=open&limit=50" |
                      jq --arg h "$BRANCH" 'first(.[] | select(.head.ref == $h)) | .number') ;;
            *) echo "::error::creating the PR returned $(cat "$RUNNER_TEMP/code")"; exit 1 ;;
          esac
          sh scripts/agent-status.sh "$N" pr-open
          sh scripts/agent-status.sh "$pr" validate

  review:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'status:validate')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: jq
      - name: Issue and diff
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr.md"
          # The issue: "Closes #n" in the body, else the agent/issue-<n> branch.
          n=$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' "$RUNNER_TEMP/pr.md" |
              head -n 1 | grep -oE '[0-9]+$' || true)
          case $HEAD_REF in agent/issue-*) n=${n:-${HEAD_REF#agent/issue-}} ;; esac
          case $n in
            ''|*[!0-9]*) echo "(no linked issue: review against the PR description)" > "$RUNNER_TEMP/issue.md"; n= ;;
            *) curl -sSf -H "Authorization: token $TOKEN" "$API/issues/$n" |
                 jq -r '"# #\(.number): \(.title)\n\n\(.body // "")"' > "$RUNNER_TEMP/issue.md" ;;
          esac
          echo "ISSUE=$n" >> "$GITHUB_ENV"
          git diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.patch"
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The stronger model, read-only tools: the reviewer judges, it does not fix.
      - name: Review against the issue
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p --model opus --max-turns 60 \
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            > "$RUNNER_TEMP/review.md" <<EOF
          You review a pull request of geistlib written by another agent or a
          person. You did not write it; do not trust its description.

          The requirements: $RUNNER_TEMP/issue.md. The change:
          $RUNNER_TEMP/diff.patch (the tree is checked out at its head). The
          PR description, including the author's assumptions:
          $RUNNER_TEMP/pr.md.

          Write in Markdown:
          1. Every requirement / acceptance criterion, one line each:
             ✅ met, ❌ not met, ⚠️ unclear, with the evidence (file:line).
          2. Every assumption the PR lists: acceptable or not, and why.
          3. Violations of AGENT.md in the changed lines (parameter order,
             [static], heap.h, checked.h, bounds by subtraction, errors).
             Formatting and the build are CI's job; skip them.
          4. Anything the change does that the requirements did not ask for.
          Be short and concrete: a FAIL is the next agent's work order. The
          very last line is exactly "VERDICT: PASS" (every requirement met,
          nothing in 3) or "VERDICT: FAIL".
          EOF

      - name: Comment, then accept and merge, or send back
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
        run: |
          auth="Authorization: token $TOKEN"
          comment() { jq -Rs '{body: .}' |
                      curl -sSf -o /dev/null -X POST "$API/issues/$1/comments" \
                        -H "$auth" -H 'Content-Type: application/json' -d @-; }
          { printf '**Agent review** of %.8s\n\n' "$HEAD_SHA"; cat "$RUNNER_TEMP/review.md"; } | comment "$PR"
          if tail -n 1 "$RUNNER_TEMP/review.md" | grep -qx 'VERDICT: PASS'; then
            sh scripts/agent-status.sh "$PR" accepted
            # Merges once the required checks are green; head_commit_id: only the reviewed head.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API/pulls/$PR/merge" \
                     -H "$auth" -H 'Content-Type: application/json' \
                     -d "{\"Do\":\"merge\",\"merge_when_checks_succeed\":true,\"head_commit_id\":\"$HEAD_SHA\"}")
            case $code in 200|201|409) ;; *) echo "::error::scheduling the merge returned $code"; exit 1 ;; esac
            exit 0
          fi
          [ -z "$ISSUE" ] || printf 'PR #%s: review of %.8s failed, back to the agent (status:fix). Findings on the PR.\n' \
                               "$PR" "$HEAD_SHA" | comment "$ISSUE"
          sh scripts/agent-status.sh "$PR" fix

  fix:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.sender.login == 'germar' && startsWith(github.event.comment.body, '/agent')) ||
      (github.event_name == 'pull_request' && github.event.action != 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'status:fix'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      ROUNDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 15
        with:
          packages: gcc-14 jq
      - name: The feedback, and the round limit
        id: fb
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
        run: |
          auth="Authorization: token $TOKEN"
          curl -sSf -H "$auth" "$API/pulls/$PR" > "$RUNNER_TEMP/pull.json"
          # ponytail: the first 50 comments only; an agent PR never gets near that
          curl -sSf -H "$auth" "$API/issues/$PR/comments?limit=50" > "$RUNNER_TEMP/comments.json"
          echo "ref=$(jq -r .head.ref "$RUNNER_TEMP/pull.json")" >> "$GITHUB_OUTPUT"
          jq -r '"# \(.title)\n\n\(.body // "")"' "$RUNNER_TEMP/pull.json" > "$RUNNER_TEMP/pr.md"
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            jq -r .comment.body "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/feedback.md"
          else
            # The work order: the newest review or CI failure. A round is one
            # earlier fix ("**Agent:**" summary); /agent runs are not limited.
            rounds=$(jq '[.[].body | select(startswith("**Agent:**"))] | length' "$RUNNER_TEMP/comments.json")
            if [ "$rounds" -ge "$ROUNDS" ]; then
              printf '**Agent:** %s fix rounds without a PASS and a green CI; status:stuck, a human'"'"'s turn.\n' \
                "$rounds" | jq -Rs '{body: .}' |
                curl -sSf -o /dev/null -X POST "$API/issues/$PR/comments" \
                  -H "$auth" -H 'Content-Type: application/json' -d @-
              sh scripts/agent-status.sh "$PR" stuck
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            jq -r '[.[].body | select(startswith("**Agent review**") or startswith("**CI failed**"))] | last // ""' \
              "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/feedback.md"
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Install clang-format 22 and Claude Code
        if: steps.fb.outputs.go == 'true'
        run: |
          sudo python3 -m pip install --break-system-packages clang-format==22.1.5
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work the feedback
        if: steps.fb.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IS_SANDBOX: "1"
        run: |
          git config user.name "geist-agent"
          git config user.email "agent@geisten.net"
          git rev-parse HEAD > "$RUNNER_TEMP/before"
          claude -p --dangerously-skip-permissions --max-turns 200 \
            > "$RUNNER_TEMP/summary.md" <<EOF
          You continue work on a geistlib pull request: its description is in
          $RUNNER_TEMP/pr.md, the feedback to act on (a review, the log tails
          of a failed CI run, or a comment starting with /agent) in
          $RUNNER_TEMP/feedback.md. The PR's head is checked out;
          git diff origin/main...HEAD shows the work so far.
          Follow AGENT.md.

          - Fix what the feedback finds; where it is wrong, say why instead.
          - Commit on the current branch; each message says why and ends with
            "Co-Authored-By: Claude <noreply@anthropic.com>".
          - Before you finish, these must pass:
              make format-check
              make test-unit MODE=release TARGET=linux CC=gcc-14 AUTO_FETCH_MODEL=0
          - Do not push, rebase or amend; do not run benchmarks or real
            models, do not ssh anywhere, do not edit CHANGELOG.md or
            .gitea/workflows/.
          - Your final answer, in a few lines: what you changed, or why you
            changed nothing.
          EOF

      - name: Push, report, -> status:validate (or stuck)
        if: steps.fb.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
          REF: ${{ steps.fb.outputs.ref }}
        run: |
          next=stuck
          if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/before")" ]; then
            git push "${GITHUB_SERVER_URL%%://*}://x-access-token:$TOKEN@${GITHUB_SERVER_URL#*://}/$GITHUB_REPOSITORY.git" \
              "HEAD:refs/heads/$REF"
            next=validate
          fi
          jq -n --rawfile b "$RUNNER_TEMP/summary.md" '{body: ("**Agent:** " + $b)}' |
            curl -sSf -o /dev/null -X POST "$API/issues/$PR/comments" \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d @-
          sh scripts/agent-status.sh "$PR" "$next"

  # A push after the review: what is scheduled to merge is no longer what
  # was reviewed. Cancel the merge and review again.
  reset:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'status:accepted')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install deps
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: jq
      - name: Cancel the auto-merge, -> status:validate
        env:
          TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
        run: |
          # 404: nothing scheduled (it merged already, or was never scheduled).
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$API/pulls/$PR/merge" \
                   -H "Authorization: token $TOKEN")
          case $code in 204|404) ;; *) echo "::error::cancelling the merge returned $code"; exit 1 ;; esac
          sh scripts/agent-status.sh "$PR" validate
