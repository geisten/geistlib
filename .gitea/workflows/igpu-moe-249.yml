# One-shot for #249 (scratch branch, not for merge): state of the desktop
# after run 3804, where the Qwen3.6-35B sweep on the iGPU outlived its timeout.
name: igpu-moe-249
on:
  push:
    branches: [agent/issue-249-igpu-rerun]
permissions:
  contents: read
jobs:
  igpu:
    runs-on: geist-vulkan
    timeout-minutes: 10
    steps:
      - name: Leftovers of run 3804 (before any checkout cleans the workspace)
        run: |
          set +e
          pgrep -a 'bench_|llama-bench' ; echo "pgrep rc $?"
          free -g; uptime
          for f in $(find "$HOME/gitea-runner-geisten/work" -name log35.txt -o -name results35.jsonl 2>/dev/null); do
            echo "=== $f"; grep -av '^cc \|^llama_\|^load_tensors\|^print_info' "$f" | tail -150 | cut -c1-400
          done
          journalctl -k --since "5 hours ago" --no-pager 2>&1 | grep -iE 'amdgpu|radeon|drm|hung|timeout|oom' | tail -40
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
          timeout -k 5 60 vulkaninfo --summary 2>&1 | grep -E 'deviceName|driverInfo'; echo "vulkaninfo rc $?"
