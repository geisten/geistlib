name: fix-v0.20.0-index
# temporary: the v0.20.0 page on geisten.net without the dropped Hugging Face links
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - env:
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
        run: |
          set -eu
          command -v rsync >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y rsync >/dev/null; }
          TAG=v0.20.0; mkdir -p stage/geistlib/$TAG
          curl -fsS -o SHA256SUMS https://geisten.net/download/geistlib/$TAG/SHA256SUMS
          { echo "<!doctype html><meta charset=utf-8><title>geistlib $TAG</title>"
            echo "<h1>geistlib $TAG</h1><p>Verify with <code>sha256sum -c SHA256SUMS</code>.</p><ul>"
            while read -r sum f; do echo "<li><a href=\"$f\">$f</a> <code>$sum</code></li>"; done < SHA256SUMS
            echo "<li><a href=\"SHA256SUMS\">SHA256SUMS</a></li></ul>"; } > stage/geistlib/$TAG/index.html
          chmod 644 stage/geistlib/$TAG/index.html
          mkdir -p ~/.ssh && umask 077 && printf '%s\n' "$DOWNLOAD_SSH_KEY" > ~/.ssh/download_key
          echo "www.geisten.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO66CjOfnd/GIiCFyqhGxLudBXi/mCD0IA8DBbbZ2O2i" > ~/.ssh/known_hosts_download
          umask 022
          rsync -rlt -e "ssh -F /dev/null -i $HOME/.ssh/download_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_download" stage/ germar@www.geisten.net:
          curl -fsS https://geisten.net/download/geistlib/latest/ | grep -c "<li>"
